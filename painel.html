<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Restrito - Kiko Barbearia</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #050505; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }
        .painel-container {
            background-color: #0a0a0a;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #d4af37;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.1);
        }
        h2 {
            color: #d4af37;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 1.5em;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            color: #aaaaaa; 
            font-size: 0.9em; 
            text-transform: uppercase; 
            font-weight: 600; 
        }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 15px; 
            background-color: #111; 
            color: #ffffff; 
            border: 1px solid #333;
            border-radius: 4px;
            box-sizing: border-box; 
            font-family: 'Montserrat', sans-serif;
            font-size: 1em;
        }
        .form-group input:focus, .form-group select:focus { 
            outline: none; 
            border-color: #d4af37; 
        }
        .btn-admin {
            background-color: #d4af37;
            color: #050505;
            padding: 15px;
            border: none;
            width: 100%;
            font-size: 1.1em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }
        .btn-admin:hover { opacity: 0.8; }
        .btn-voltar {
            background-color: transparent;
            color: #777;
            border: 1px solid #333;
            padding: 10px;
            width: 100%;
            margin-top: 15px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            display: block;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-voltar:hover { color: #fff; border-color: #fff; }
        
        /* Oculta as telas dinamicamente */
        #tela-admin { display: none; }
        
        .erro-senha {
            color: #ff4444;
            text-align: center;
            margin-top: 15px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- TELA 1: LOGIN -->
    <div class="painel-container" id="tela-login">
        <h2>Acesso Restrito</h2>
        <div class="form-group">
            <label for="senha">Senha de Administrador:</label>
            <input type="password" id="senha" placeholder="Digite a sua senha">
        </div>
        <button onclick="verificarSenha()" class="btn-admin">Entrar no Sistema</button>
        <p class="erro-senha" id="erro-senha">Senha incorreta. Tente novamente.</p>
        <a href="index.html" class="btn-voltar">Voltar para o Site</a>
    </div>

    <!-- TELA 2: PAINEL DE CONTROLE (Oculto inicialmente) -->
    <div class="painel-container" id="tela-admin">
        <h2>Controle de Agenda</h2>
        
        <form id="formAdmin">
            <div class="form-group">
                <label for="nome">Nome (ou Bloqueio):</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: João Silva ou Fechado" required>
            </div>
            
            <div class="form-group">
                <label for="servico">Serviço/Função:</label>
                <select id="servico" name="servico" required onchange="atualizarValor()">
                    <option value="" disabled selected data-valor="0">Selecione...</option>
                    <option value="Corte Premium" data-valor="50">Corte Premium (R$ 50,00)</option>
                    <option value="Barboterapia" data-valor="50">Barboterapia (R$ 50,00)</option>
                    <option value="O Pacote Completo" data-valor="100">O Pacote Completo (R$ 100,00)</option>
                    <option value="Progressiva" data-valor="150">Progressiva (R$ 150,00)</option>
                    <option value="Pigmentação" data-valor="100">Pigmentação (R$ 100,00)</option>
                    <option value="Coloração" data-valor="100">Coloração (R$ 100,00)</option>
                    <option value="Design de Sobrancelha" data-valor="25">Design de Sobrancelha (R$ 25,00)</option>
                    <option value="Bloqueio de Agenda (Interno)" data-valor="0" style="color:#d4af37; font-weight:bold;">⚠️ Bloqueio de Horário</option>
                </select>
                <input type="hidden" id="valor" name="valor" value="0">
            </div>

            <div class="form-group">
                <label for="data">Data:</label>
                <input type="date" id="data" name="data" required onchange="verificarHorarios()">
            </div>

            <div class="form-group">
                <label for="hora">Horário a Bloquear:</label>
                <select id="hora" name="hora" required disabled>
                    <option value="" disabled selected>Selecione a data primeiro...</option>
                </select>
            </div>

            <button type="submit" id="btnSubmit" class="btn-admin">Confirmar Bloqueio</button>
            <p id="mensagem-status" style="text-align: center; margin-top: 15px; font-weight: 600;"></p>

            <button type="button" onclick="sair()" class="btn-voltar" style="color: #ff4444; border-color: #ff4444;">Sair / Bloquear Tela</button>
        </form>
    </div>

    <!-- SCRIPTS -->
    <script>
        // --- SISTEMA DE LOGIN ---
        function verificarSenha() {
            var senhaDigitada = document.getElementById('senha').value;
            // AQUI FICA A SUA SENHA. Pode alterar o "Kiko2026" para o que desejar.
            if(senhaDigitada === "Kiko2026") {
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('tela-admin').style.display = 'block';
                // Quando o login dá certo, puxamos os dados da nuvem
                carregarDados();
            } else {
                document.getElementById('erro-senha').style.display = 'block';
            }
        }

        function sair() {
            document.getElementById('senha').value = '';
            document.getElementById('tela-admin').style.display = 'none';
            document.getElementById('tela-login').style.display = 'block';
            document.getElementById('erro-senha').style.display = 'none';
        }

        // --- SISTEMA DE BANCO DE DADOS (O MESMO QUE JÁ ESTÁ FUNCIONANDO) ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw8eC5tExG3qBqSk11BbeQg9dPHTNk8jfZ_KgtFfIpqBnTNbGSbW_E6EcIrrRZNnjI6/exec';
        
        const form = document.getElementById('formAdmin');
        const btnSubmit = document.getElementById('btnSubmit');
        const msgStatus = document.getElementById('mensagem-status');
        const selectHora = document.getElementById('hora');
        const inputData = document.getElementById('data');
        let agendamentosDaNuvem = [];

        function atualizarValor() {
            const selectServico = document.getElementById('servico');
            const valorOption = selectServico.options[selectServico.selectedIndex].getAttribute('data-valor');
            document.getElementById('valor').value = valorOption;
        }

        function carregarDados() {
            msgStatus.innerText = "Sincronizando com a nuvem...";
            fetch(scriptURL)
                .then(response => response.json())
                .then(data => {
                    agendamentosDaNuvem = data;
                    msgStatus.innerText = "";
                })
                .catch(error => {
                    console.error("Erro ao carregar dados", error);
                    msgStatus.innerText = "Modo Offline.";
                });
        }

        function verificarHorarios() {
            const dataEscolhida = inputData.value;
            if (!dataEscolhida) return;

            selectHora.disabled = false;
            selectHora.innerHTML = '<option value="" disabled selected>Selecione um horário...</option>';
            
            const todosHorarios = ["08:00", "09:00", "10:00", "11:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00"];
            
            todosHorarios.forEach(hora => {
                const ocupado = agendamentosDaNuvem.some(ag => {
                    let dataDoGoogle = String(ag.data).replace(/T.*/, "");
                    let dataBaseString = String(ag.data);
                    
                    let horasBatem = String(ag.hora).trim() === String(hora).trim();
                    let datasBatem = dataBaseString.includes(dataEscolhida) || dataDoGoogle === dataEscolhida;

                    if (!datasBatem && dataBaseString.includes("T")) {
                         let tempDate = new Date(ag.data);
                         tempDate.setMinutes(tempDate.getMinutes() + tempDate.getTimezoneOffset());
                         let dataCorrigida = tempDate.toISOString().split('T')[0];
                         if (dataCorrigida === dataEscolhida) {
                             datasBatem = true;
                         }
                    }

                    return datasBatem && horasBatem;
                });
                
                const option = document.createElement('option');
                option.value = hora;
                
                if (ocupado) {
                    option.text = hora + " (Bloqueado)";
                    option.disabled = true;
                    option.style.color = "#ff4444";
                } else {
                    option.text = hora;
                }
                selectHora.add(option);
            });
        }

        form.addEventListener('submit', e => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Enviando comando...";
            msgStatus.innerText = "Registrando bloqueio...";
            msgStatus.style.color = "#d4af37";

            const formData = new FormData(form);

            fetch(scriptURL, { method: 'POST', body: formData, mode: 'no-cors' })
                .then(() => {
                    msgStatus.innerText = "Salvo com sucesso!";
                    msgStatus.style.color = "#25D366";
                    
                    form.reset();
                    selectHora.disabled = true;
                    
                    carregarDados();

                    setTimeout(() => {
                        btnSubmit.disabled = false;
                        btnSubmit.innerText = "Confirmar Bloqueio";
                        msgStatus.innerText = "";
                    }, 2500);
                })
                .catch(error => {
                    msgStatus.innerText = "Erro ao enviar.";
                    msgStatus.style.color = "#ff4444";
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Confirmar Bloqueio";
                });
        });
    </script>
</body>
</html>
