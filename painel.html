<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Kiko Barbearia Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; padding: 20px 10px; position: relative; }
        
        .admin-container { width: 100%; max-width: 500px; background-color: #0d0d0d; border: 1px solid #c8a355; border-radius: 8px; padding: 20px; display: none; }
        h1.logo { text-align: center; color: #c8a355; font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 25px; text-transform: uppercase; }

        /* TELA DE LOGIN */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #0d0d0d; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-box { background-color: #1a1a1a; padding: 30px; border-radius: 8px; border: 1px solid #c8a355; text-align: center; width: 90%; max-width: 350px; }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; background-color: #222; border: 1px solid #333; color: white; border-radius: 4px; text-align: center; font-size: 1rem; }
        .login-box button { width: 100%; padding: 12px; background-color: #c8a355; color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }

        /* DASHBOARD */
        .section-card { background-color: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 15px; margin-bottom: 20px; }
        .section-title { color: #c8a355; font-size: 0.85rem; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .dash-box { background-color: #222; padding: 15px; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; }
        .ganhos-box { border-left: 3px solid #ffd700; } .agend-box { border-left: 3px solid #00bfff; }
        .box-label { font-size: 0.7rem; color: #aaaaaa; font-weight: 600; margin-bottom: 5px; }
        .box-value { font-size: 1.3rem; font-weight: 700; color: #ffffff; }
        
        /* BOTÕES DO MENU */
        .menu-btn { width: 100%; background-color: transparent; color: #c8a355; border: 1px solid #333; padding: 15px; text-align: left; font-size: 0.85rem; font-weight: 600; border-radius: 6px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: flex-start; gap: 10px;}
        .menu-btn:hover { background-color: #1a1a1a; border-color: #c8a355; }
        .logout-btn { width: 100%; background-color: transparent; color: #ff4c4c; border: 1px solid #333; padding: 12px; font-size: 0.75rem; border-radius: 6px; margin-top: 20px; cursor: pointer; }

        /* JANELAS MODAIS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 10px; }
        .modal-content { background-color: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #c8a355; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; }
        .modal-title { color: #c8a355; margin-bottom: 15px; font-size: 1rem; border-bottom: 1px solid #333; padding-bottom: 10px;}
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; background-color: #222; border: 1px solid #444; color: white; border-radius: 4px; }
        .action-btn { background-color: #c8a355; color: black; border: none; padding: 12px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px;}
        .close-btn { background-color: #333; color: white; border: none; padding: 12px 15px; border-radius: 4px; cursor: pointer; width: 100%; }
        
        /* LINHAS DE SERVIÇOS E GALERIA */
        .linha-item { display: flex; gap: 5px; margin-bottom: 10px; align-items: center; background: #222; padding: 10px; border-radius: 4px;}
        .linha-item input { width: 100%; padding: 8px; background: #111; border: 1px solid #444; color: white; font-size: 0.8rem;}
        .remove-btn { background: #ff4c4c; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;}
        .midia-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; background: #000; }
        .midia-link { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.75rem; color: #aaa; margin-left: 10px;}
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1 class="logo">KIKO BARBEARIA PRO</h1>
            <p style="font-size: 0.8rem; color: #777;">Acesso Restrito</p>
            <input type="password" id="senha-admin" placeholder="Digite a palavra-passe">
            <button onclick="verificarSenha()">Entrar no Painel</button>
            <p id="erro-senha" style="color: #ff4c4c; font-size: 0.8rem; margin-top: 10px; display: none;">Senha incorreta!</p>
        </div>
    </div>

    <div class="admin-container" id="main-dashboard">
        <h1 class="logo">Kiko Barbearia Pro</h1>

        <div class="section-card">
            <div class="section-title">📊 RESUMO DO MÊS</div>
            <div class="dashboard-grid">
                <div class="dash-box ganhos-box">
                    <div class="box-label">GANHOS ESTIMADOS</div>
                    <div class="box-value" id="ganhos-estimados">R$ 0,00</div>
                </div>
                <div class="dash-box agend-box">
                    <div class="box-label">AGENDAMENTOS</div>
                    <div class="box-value" id="total-agendamentos">0</div>
                </div>
            </div>
        </div>

        <button class="menu-btn" onclick="abrirModal('modal-agendar')">📅 AGENDAR MANUAMENTE</button>
        <button class="menu-btn" onclick="abrirModalServicos()">✂️ GERENCIAR SERVIÇOS E PREÇOS</button>
        <button class="menu-btn" onclick="abrirModal('modal-horarios')">🕒 HORÁRIO DE FUNCIONAMENTO</button>
        <button class="menu-btn" onclick="abrirModal('modal-textos')">🎨 TEXTOS DO SITE</button>
        <button class="menu-btn" onclick="abrirModalGaleria()" style="border-color: #ffd700;">📸 GERENCIAR GALERIA / VÍDEOS</button>

        <button class="logout-btn" onclick="window.location.reload()">🔒 Sair e Bloquear Painel</button>
    </div>

    <!-- MODAL AGENDAR -->
    <div id="modal-agendar" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">📅 Agendar Manualmente</h2>
            <div class="input-group"><input type="text" id="agend-nome" placeholder="Nome do Cliente"></div>
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;"><input type="date" id="agend-data"></div>
                <div class="input-group" style="flex: 1;"><input type="time" id="agend-hora"></div>
            </div>
            <button class="action-btn" onclick="salvarAgendamento()">Confirmar Registo</button>
            <button class="close-btn" onclick="fecharModal('modal-agendar')">Cancelar</button>
        </div>
    </div>

    <!-- MODAL SERVIÇOS -->
    <div id="modal-servicos" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">✂️ Serviços e Preços</h2>
            <div id="lista-servicos-container"></div>
            <button class="action-btn" style="background-color: #444; color: white;" onclick="adicionarLinhaServico('', '', '')">+ Novo Serviço</button>
            <br><br>
            <button class="action-btn" onclick="salvarServicos()">Guardar Todos</button>
            <button class="close-btn" onclick="fecharModal('modal-servicos')">Cancelar</button>
        </div>
    </div>

    <!-- MODAL HORÁRIOS -->
    <div id="modal-horarios" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">🕒 Horário de Funcionamento</h2>
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;"><label>Abre às:</label><input type="time" id="edit-abre" value="08:00"></div>
                <div class="input-group" style="flex: 1;"><label>Fecha às:</label><input type="time" id="edit-fecha" value="19:40"></div>
            </div>
            <button class="action-btn" onclick="salvarHorarios()">Guardar Horários</button>
            <button class="close-btn" onclick="fecharModal('modal-horarios')">Cancelar</button>
        </div>
    </div>

    <!-- MODAL TEXTOS -->
    <div id="modal-textos" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">🎨 Textos do Site</h2>
            <div class="input-group"><label>Título Principal</label><input type="text" id="edit-titulo"></div>
            <div class="input-group"><label>Subtítulo</label><input type="text" id="edit-subtitulo"></div>
            <button class="action-btn" onclick="salvarTextos()">Guardar Alterações</button>
            <button class="close-btn" onclick="fecharModal('modal-textos')">Cancelar</button>
        </div>
    </div>

    <!-- MODAL GALERIA -->
    <div id="modal-galeria" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">📸 Gerenciar Galeria</h2>
            
            <div style="background: #111; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px dashed #d4af37;">
                <label style="font-size: 0.8rem; color:#aaa;">Adicionar Nova Mídia (.jpg, .png, .mp4)</label>
                <div style="display: flex; gap: 10px; margin-top: 5px;">
                    <input type="text" id="nova-foto-url" placeholder="Cole o link aqui" style="flex:1; padding: 10px; background:#222; border:1px solid #444; color:white; border-radius:4px;">
                    <button class="action-btn" style="width: auto; margin:0;" onclick="salvarFotoGaleria()">Adicionar</button>
                </div>
            </div>

            <h3 style="font-size: 0.9rem; color: #fff; margin-bottom: 10px;">Mídias Atuais no Site:</h3>
            <div id="lista-galeria-container" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;">
                <!-- Lista será gerada aqui -->
            </div>

            <button class="close-btn" onclick="fecharModal('modal-galeria')">Fechar Gerenciador</button>
        </div>
    </div>

    <script>
        // LIGAÇÃO DIRETA AO NOVO SERVIDOR (COM O SEU LINK)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxbj0EtBYyEYBw1-d8TdA_Rd6bLN6fn893aG6YF12Gp99D8ME4jr7ZKjViCKV-q27C7DQ/exec';
        
        function verificarSenha() {
            if (document.getElementById('senha-admin').value === "kiko2026") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-dashboard').style.display = 'block';
                atualizarPainelAdmin();
            } else {
                document.getElementById('erro-senha').style.display = 'block';
            }
        }

        function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
        function fecharModal(id) { document.getElementById(id).style.display = 'none'; }

        async function atualizarPainelAdmin() {
            try {
                const response = await fetch(SCRIPT_URL + '?acao=dashboard');
                const data = await response.json();
                
                // Atualiza os valores com segurança contra nulos
                const faturamento = data.faturamento || 0;
                const totalAgendamentos = data.agendamentosMes || 0;

                document.getElementById('ganhos-estimados').innerText = faturamento.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                document.getElementById('total-agendamentos').innerText = totalAgendamentos;
            } catch (err) { 
                console.error("Erro ao carregar dashboard:", err);
                document.getElementById('ganhos-estimados').innerText = "R$ 0,00";
                document.getElementById('total-agendamentos').innerText = "0";
            }
        }

        async function abrirModalGaleria() {
            abrirModal('modal-galeria');
            const container = document.getElementById('lista-galeria-container');
            container.innerHTML = '<p style="color:#aaa; font-size:0.8rem;">A carregar ficheiros...</p>';
            
            try {
                const resposta = await fetch(SCRIPT_URL + '?acao=obter_fotos');
                const fotos = await resposta.json();
                container.innerHTML = '';

                if(!fotos || fotos.length === 0) {
                    container.innerHTML = '<p style="color:#777; font-size:0.8rem;">A galeria está vazia.</p>'; return;
                }

                fotos.forEach(link => {
                    const div = document.createElement('div');
                    div.className = 'linha-item';
                    
                    const isVideo = link.toLowerCase().includes('.mp4');
                    let thumbHtml = isVideo ? `<video src="${link}" class="midia-thumb" muted></video>` : `<img src="${link}" class="midia-thumb" onerror="this.style.display='none'">`;
                    
                    if(link.includes('<blockquote') || link.length > 200) {
                        thumbHtml = `<div class="midia-thumb" style="display:flex; align-items:center; justify-content:center; color:red; font-size:0.6rem; border: 1px solid red;">ERRO</div>`;
                    }

                    div.innerHTML = `${thumbHtml}<span class="midia-link" style="font-size: 0.65rem;">${link.substring(0, 50)}...</span>`;
                    
                    const btn = document.createElement('button');
                    btn.className = 'remove-btn'; btn.innerText = 'X';
                    btn.onclick = function() { apagarFotoGaleria(link); };
                    
                    div.appendChild(btn); container.appendChild(div);
                });
            } catch (e) {
                container.innerHTML = '<p style="color:#ff4444;">Erro ao carregar dados.</p>';
            }
        }

        async function salvarFotoGaleria() {
            const urlFoto = document.getElementById('nova-foto-url').value;
            if (!urlFoto || !urlFoto.includes('http')) return alert("Link inválido.");
            
            const btn = event.target; btn.innerText = "...";
            const formData = new URLSearchParams();
            formData.append('acao', 'salvar_foto'); formData.append('url_foto', urlFoto);
            
            await fetch(SCRIPT_URL, { method: 'POST', body: formData.toString(), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
            document.getElementById('nova-foto-url').value = '';
            btn.innerText = "Adicionar"; abrirModalGaleria(); 
        }

        async function apagarFotoGaleria(linkParaApagar) {
            const confirmar = confirm("Tem a certeza que deseja excluir esta mídia do site?");
            if(!confirmar) return;

            const formData = new URLSearchParams();
            formData.append('acao', 'remover_foto'); formData.append('url_foto', linkParaApagar);
            
            alert('A excluir do servidor...');
            await fetch(SCRIPT_URL, { method: 'POST', body: formData.toString(), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
            alert('Excluído com sucesso!'); abrirModalGaleria(); 
        }

        async function salvarAgendamento() {
            const nome = document.getElementById('agend-nome').value || "Bloqueio";
            const data = document.getElementById('agend-data').value;
            const hora = document.getElementById('agend-hora').value;
            if(!data || !hora) return alert("Preencha a data e a hora!");
            const formData = new URLSearchParams();
            formData.append('nome', nome); formData.append('servico', 'Manual');
            formData.append('data', data); formData.append('hora', hora);
            await fetch(SCRIPT_URL, { method: 'POST', body: formData.toString(), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
            alert('Agendado com sucesso!'); fecharModal('modal-agendar'); atualizarPainelAdmin();
        }

        async function abrirModalServicos() {
            abrirModal('modal-servicos');
            document.getElementById('lista-servicos-container').innerHTML = '<p>A carregar...</p>';
            const res = await fetch(SCRIPT_URL + '?acao=obter_textos'); const data = await res.json();
            const servicos = JSON.parse(data.servicos || "[]");
            document.getElementById('lista-servicos-container').innerHTML = '';
            servicos.forEach(s => adicionarLinhaServico(s.nome, s.preco, s.tempo));
        }

        function adicionarLinhaServico(n, p, t) {
            const div = document.createElement('div'); div.className = 'linha-item';
            div.innerHTML = `<input type="text" value="${n}" class="s-nome"><input type="number" value="${p}" class="s-preco" style="width:60px;"><input type="number" value="${t}" class="s-tempo" style="width:60px;"><button class="remove-btn" onclick="this.parentElement.remove()">X</button>`;
            document.getElementById('lista-servicos-container').appendChild(div);
        }

        async function salvarServicos() {
            let novos = [];
            document.querySelectorAll('#lista-servicos-container .linha-item').forEach(l => {
                const n = l.querySelector('.s-nome').value; const p = parseFloat(l.querySelector('.s-preco').value||0); const t = parseInt(l.querySelector('.s-tempo').value||0);
                if(n) novos.push({nome: n, preco: p, tempo: t});
            });
            const fd = new URLSearchParams(); fd.append('acao', 'salvar_servicos'); fd.append('servicos_json', JSON.stringify(novos));
            await fetch(SCRIPT_URL, { method: 'POST', body: fd.toString(), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
            alert('Serviços guardados!'); fecharModal('modal-servicos');
        }

        async function salvarTextos() {
            const titulo = document.getElementById('edit-titulo').value; const subtitulo = document.getElementById('edit-subtitulo').value;
            const fd = new URLSearchParams(); fd.append('acao', 'salvar_textos');
            if(titulo) fd.append('titulo', titulo); if(subtitulo) fd.append('subtitulo', subtitulo);
            await fetch(SCRIPT_URL, { method: 'POST', body: fd.toString(), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
            alert('Guardado!'); fecharModal('modal-textos');
        }

        async function salvarHorarios() {
            const fd = new URLSearchParams(); fd.append('acao', 'salvar_horarios');
            fd.append('horarios_json', JSON.stringify({abre: document.getElementById('edit-abre').value, fecha: document.getElementById('edit-fecha').value, almoco_inicio: "11:40", almoco_fim: "13:00", dias_abertos: [1,2,3,4,5,6]}));
            await fetch(SCRIPT_URL, { method: 'POST', body: fd.toString(), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
            alert('Guardado!'); fecharModal('modal-horarios');
        }
    </script>
</body>
</html>
