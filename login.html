<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Login | Kiko Barbearia</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; color: #ffffff; background-color: #050505; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { background-color: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); padding: 40px; border: 1px solid rgba(212, 175, 55, 0.4); width: 100%; max-width: 400px; border-radius: 8px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h1 { color: #d4af37; text-align: center; font-size: 1.8em; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #dddddd; font-size: 0.85em; text-transform: uppercase; font-weight: 600; }
        .form-group input { width: 100%; padding: 14px; background-color: rgba(0,0,0,0.5); color: #ffffff; border: 1px solid #444; box-sizing: border-box; border-radius: 4px; font-family: 'Montserrat', sans-serif; }
        .form-group input:focus { border-color: #d4af37; outline: none; }
        .btn-gold { background-color: #d4af37; color: #050505; width: 100%; padding: 15px; text-decoration: none; font-size: 1em; font-weight: 700; text-transform: uppercase; border-radius: 4px; border: 2px solid #d4af37; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-gold:hover { background-color: #b38f27; border-color: #b38f27; }
        .links-uteis { text-align: center; margin-top: 20px; font-size: 0.9em; }
        .links-uteis a { color: #d4af37; text-decoration: none; font-weight: 600; }
        .links-uteis a:hover { text-decoration: underline; }
        .mensagem-erro { background: rgba(255, 68, 68, 0.1); border: 1px solid #ff4444; color: #ff4444; padding: 10px; border-radius: 4px; font-size: 0.85em; text-align: center; margin-bottom: 15px; display: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Área Restrita</h1>
        <div id="msgErro" class="mensagem-erro"></div>
        
        <form id="formLogin" onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label for="id_barbearia">ID da Barbearia:</label>
                <input type="text" id="id_barbearia" name="id_barbearia" placeholder="ex: kikobarbearia" required>
            </div>
            <div class="form-group">
                <label for="senha">Palavra-passe (Senha):</label>
                <input type="password" id="senha" name="senha" placeholder="********" required>
            </div>
            <button type="submit" id="btnLogin" class="btn-gold">Entrar no Painel</button>
        </form>

        <div class="links-uteis">
            <p>Ainda não tem barbearia registada? <a href="registro.html">Criar Conta</a></p>
            <p style="margin-top: 10px;"><a href="index.html" id="linkSitePublico">← Voltar para o Site</a></p>
        </div>
    </div>

    <script>
        // URL do teu Web App do Google Apps Script
        const URL_SCRIPT_BACKEND = "https://script.google.com/macros/s/AKfycbxbj0EtBYyEYBw1-d8TdA_Rd6bLN6fn893aG6YF12Gp99D8ME4jr7ZKjViCKV-q27C7DQ/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id');
        if (idParam) {
            document.getElementById('id_barbearia').value = idParam;
            document.getElementById('linkSitePublico').href = `index.html?id=${idParam}`;
        }

        function fazerLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const msgErro = document.getElementById('msgErro');
            const idBarb = document.getElementById('id_barbearia').value.trim().toLowerCase().replace(/\s+/g, '_');
            const senha = document.getElementById('senha').value.trim();

            if (!idBarb || !senha) {
                msgErro.innerText = "Por favor, preencha todos os campos!";
                msgErro.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerText = "A validar...";
            msgErro.style.display = 'none';

            const dadosLogin = {
                acao: "login_saas",
                id_barbearia: idBarb,
                senha: senha
            };

            // Comunicação real com o Google Apps Script para validar a senha
            fetch(URL_SCRIPT_BACKEND, {
                method: "POST",
                body: JSON.stringify(dadosLogin)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "sucesso") {
                    localStorage.setItem('id_barbearia_ativo', idBarb);
                    window.location.href = `admin.html?id=${idBarb}`;
                } else if (data.status === "bloqueado") {
                    msgErro.innerText = "Acesso suspenso: Mensalidade em atraso!";
                    msgErro.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = "Entrar no Painel";
                } else {
                    msgErro.innerText = data.msg || "ID ou senha incorretos!";
                    msgErro.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = "Entrar no Painel";
                }
            })
            .catch(err => {
                console.error("Erro:", err);
                msgErro.innerText = "Erro de conexão com o servidor. Tente novamente.";
                msgErro.style.display = 'block';
                btn.disabled = false;
                btn.innerText = "Entrar no Painel";
            });
        }
    </script>
</body>
</html>
