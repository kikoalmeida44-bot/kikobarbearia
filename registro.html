<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registar Barbearia | Kiko Barbearia SaaS</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; color: #ffffff; background-color: #050505; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .registro-container { background-color: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); padding: 40px; border: 1px solid rgba(212, 175, 55, 0.4); width: 100%; max-width: 450px; border-radius: 8px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h1 { color: #d4af37; text-align: center; font-size: 1.8em; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #dddddd; font-size: 0.85em; text-transform: uppercase; font-weight: 600; }
        .form-group input { width: 100%; padding: 14px; background-color: rgba(0,0,0,0.5); color: #ffffff; border: 1px solid #444; box-sizing: border-box; border-radius: 4px; font-family: 'Montserrat', sans-serif; transition: 0.3s; }
        .form-group input:focus { border-color: #d4af37; outline: none; background-color: rgba(20, 20, 20, 0.8); }
        .btn-gold { background-color: #d4af37; color: #050505; width: 100%; padding: 15px; text-decoration: none; font-size: 1em; font-weight: 700; text-transform: uppercase; border-radius: 4px; border: 2px solid #d4af37; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-gold:hover { background-color: #b38f27; border-color: #b38f27; }
        .links-uteis { text-align: center; margin-top: 20px; font-size: 0.9em; }
        .links-uteis a { color: #d4af37; text-decoration: none; font-weight: 600; }
        .links-uteis a:hover { text-decoration: underline; }
        .mensagem-erro { background: rgba(255, 68, 68, 0.1); border: 1px solid #ff4444; color: #ff4444; padding: 10px; border-radius: 4px; font-size: 0.85em; text-align: center; margin-bottom: 15px; display: none; font-weight: 600; }
        .badge-trial { background: rgba(40,167,69,0.2); border: 1px solid #28a745; color: #28a745; padding: 10px; border-radius: 4px; font-size: 0.8em; text-align: center; margin-bottom: 20px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="registro-container">
        <h1>Criar Barbearia</h1>
        <div class="badge-trial">✨ Registo com Acesso Imediato ao Sistema</div>
        <div id="msgErro" class="mensagem-erro"></div>
        
        <form id="formRegistro" onsubmit="registarBarbearia(event)">
            <div class="form-group">
                <label for="nome">Nome da Barbearia:</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Kiko Barbearia" required>
            </div>
            <div class="form-group">
                <label for="id_barbearia">ID Único (Link do Sistema):</label>
                <input type="text" id="id_barbearia" name="id_barbearia" placeholder="ex: kikobarbearia" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail de Acesso:</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label for="telefone">WhatsApp / Telefone:</label>
                <input type="text" id="telefone" name="telefone" placeholder="ex: 67999673200" required>
            </div>
            <div class="form-group">
                <label for="senha">Palavra-passe (Senha):</label>
                <input type="password" id="senha" name="senha" placeholder="********" required>
            </div>
            <button type="submit" id="btnRegistar" class="btn-gold">Concluir Registo</button>
        </form>

        <div class="links-uteis">
            <p>Já tem uma conta? <a href="login.html">Fazer Login</a></p>
        </div>
    </div>

    <script>
        // URL do teu Web App do Google Apps Script já configurada
        const URL_SCRIPT_BACKEND = "https://script.google.com/macros/s/AKfycbxbj0EtBYyEYBw1-d8TdA_Rd6bLN6fn893aG6YF12Gp99D8ME4jr7ZKjViCKV-q27C7DQ/exec";

        function registarBarbearia(e) {
            e.preventDefault();
            const btn = document.getElementById('btnRegistar');
            const msgErro = document.getElementById('msgErro');

            const nome = document.getElementById('nome').value.trim();
            const idBarb = document.getElementById('id_barbearia').value.trim().toLowerCase().replace(/\s+/g, '_');
            const email = document.getElementById('email').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const senha = document.getElementById('senha').value.trim();

            if (!nome || !idBarb || !email || !telefone || !senha) {
                msgErro.innerText = "Por favor, preencha todos os campos!";
                msgErro.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerText = "A criar conta...";
            msgErro.style.display = 'none';

            const dadosEnvio = {
                acao: "registar_novo_cliente",
                nome: nome,
                id_barbearia: idBarb,
                login: idBarb,
                email: email,
                telefone: telefone,
                senha: senha
            };

            fetch(URL_SCRIPT_BACKEND, {
                method: "POST",
                body: JSON.stringify(dadosEnvio)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "sucesso") {
                    alert("Barbearia criada com sucesso!");
                    localStorage.setItem('id_barbearia_ativo', idBarb);
                    window.location.href = `admin.html?id=${idBarb}`;
                } else {
                    msgErro.innerText = data.msg || "Erro ao registar barbearia.";
                    msgErro.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = "Concluir Registo";
                }
            })
            .catch(err => {
                console.error("Erro:", err);
                msgErro.innerText = "Erro de conexão com o servidor. Tente novamente.";
                msgErro.style.display = 'block';
                btn.disabled = false;
                btn.innerText = "Concluir Registo";
            });
        }
    </script>
</body>
</html>
