<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Galeria - Kiko Barbearia</title>
    <style>
        /* Estilos Base (iguais à página principal) */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; background-color: #121212; color: #ffffff; }
        header { background-color: #000000; padding: 20px; text-align: center; border-bottom: 3px solid #d4af37; }
        h1 { color: #d4af37; margin: 0; font-size: 2.8em; text-transform: uppercase; letter-spacing: 2px; }
        nav { margin-top: 15px; }
        nav a { color: #ffffff; text-decoration: none; margin: 0 10px; font-weight: bold; text-transform: uppercase; font-size: 0.9em; transition: color 0.3s; }
        nav a:hover { color: #d4af37; }
        
        /* Cabeçalho Menor para a Galeria */
        .page-header { text-align: center; padding: 40px 20px; background-color: #1a1a1a; border-bottom: 1px solid #333; }
        .page-header h2 { font-size: 2.5em; color: #d4af37; margin: 0; text-transform: uppercase; }
        .page-header p { color: #aaaaaa; font-size: 1.2em; margin-top: 10px; }

        .section { padding: 50px 20px; max-width: 1100px; margin: auto; text-align: center; }
        
        /* Galeria em Grid */
        .galeria-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .galeria-grid img { width: 100%; height: 280px; object-fit: cover; border-radius: 8px; border: 2px solid #333; transition: transform 0.3s, border-color 0.3s; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .galeria-grid img:hover { transform: scale(1.03); border-color: #d4af37; }

        /* Botão Final */
        .btn-whatsapp { background-color: #25D366; color: white; padding: 15px 35px; text-decoration: none; font-size: 1.2em; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 40px; transition: 0.3s; }
        .btn-whatsapp:hover { background-color: #128C7E; transform: scale(1.05); }

        footer { background-color: #000000; text-align: center; padding: 25px; border-top: 1px solid #333; color: #777777; font-size: 0.9em; }
    </style>
</head>
