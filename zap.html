<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Rápido | WhatsApp</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cor-principal: #d4af37;
            --cor-fundo: #050505;
            --cor-card: rgba(15, 15, 18, 0.85);
            --cor-borda: rgba(212, 175, 55, 0.35);
            --fonte-principal: 'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: var(--fonte-principal); 
            margin: 0; padding: 20px 12px; color: #ffffff; 
            background-color: var(--cor-fundo);
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.18), transparent 60%), radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.08), transparent 50%);
            background-attachment: fixed; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }

        .container { 
            width: 100%; max-width: 480px; margin: 10px auto; 
            background: var(--cor-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 32px 24px; border-radius: 20px; border: 1px solid var(--cor-borda); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.12); 
        }

        h3 { text-align: center; color: var(--cor-principal); text-transform: uppercase; letter-spacing: 3px; margin: 0 0 6px 0; font-size: 1.5em; font-weight: 800; }
        .subtitulo { text-align: center; font-size: 11px; color: #a0a0a0; margin-bottom: 28px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
        
        .form-group { margin-bottom: 22px; transition: all 0.4s ease; }
        .form-group label { display: block; margin-bottom: 8px; color: #e0e0e0; font-size: 0.8em; text-transform: uppercase; font-weight: 700; letter-spacing: 0.8px; }
        .form-group input, .form-group select { 
            width: 100%; padding: 14px 16px; background: rgba(0, 0, 0, 0.55); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 12px; font-family: var(--fonte-principal); font-size: 15px; transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--cor-principal); box-shadow: 0 0 12px rgba(212, 175, 55, 0.35); outline: none; background: rgba(0, 0, 0, 0.75); }

        .checkbox-group { display: flex; flex-direction: column; gap: 10px; max-height: 220px; overflow-y: auto; background: rgba(0, 0, 0, 0.35); padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .checkbox-group::-webkit-scrollbar { width: 6px; }
        .checkbox-group::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.4); border-radius: 10px; }
        .checkbox-item { display: flex; align-items: center; background: rgba(255, 255, 255, 0.03); padding: 13px 15px; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; cursor: pointer; transition: all 0.25s ease; }
        .checkbox-item:hover { border-color: var(--cor-principal); background: rgba(212, 175, 55, 0.08); transform: translateY(-1px); }
        .checkbox-item input { margin-right: 14px; transform: scale(1.3); accent-color: var(--cor-principal); cursor: pointer; }
        .checkbox-details { display: flex; justify-content: space-between; flex-grow: 1; align-items: center; }
        .checkbox-title { font-weight: 600; color: #fff; font-size: 0.9em; }
        .checkbox-price { color: var(--cor-principal); font-weight: 700; font-size: 0.95em; }

        .resumo-box { margin-top: 16px; padding: 16px; background: rgba(212, 175, 55, 0.08); border: 1px solid rgba(212, 175, 55, 0.3); border-left: 4px solid var(--cor-principal); display: none; border-radius: 10px; }
        .resumo-box p { margin: 4px 0; font-size: 0.95em; color: #d0d0d0; }
        .resumo-box strong { color: var(--cor-principal); }

        .btn-gold { background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #c19b2e 100%); color: #050505; width: 100%; padding: 16px; font-size: 1em; font-weight: 800; text-transform: uppercase; border-radius: 12px; border: none; cursor: pointer; font-family: var(--fonte-principal); margin-top: 15px; letter-spacing: 1px; box-shadow: 0 4px 20px rgba(212, 175, 55, 0.35); transition: all 0.3s ease; }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(212, 175, 55, 0.55); }
        .btn-gold:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .carregando-txt { text-align: center; color: var(--cor-principal); font-size: 14px; font-style: italic; }
        
        #campo_nascimento { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h3 id="titulo-empresa">A CARREGAR...</h3>
    <div class="subtitulo">Agendamento Rápido via WhatsApp</div>

    <form id="formAgendamento">
        <div class="form-group">
            <label for="nome">O Seu Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
            <label for="telefone">O Seu WhatsApp (Com DDD):</label>
            <input type="tel" id="telefone" placeholder="+55 67 99999-9999" required oninput="mascaraTelefone(this)" maxlength="17">
        </div>

        <!-- NOVO CAMPO: DATA DE NASCIMENTO (Oculto por padrão) -->
        <div class="form-group" id="campo_nascimento">
            <label for="data_nascimento">Data de Nascimento (Para ganhar presentes 🎉):</label>
            <input type="text" id="data_nascimento" placeholder="Ex: 15/08" maxlength="5" oninput="mascaraNascimento(this)">
        </div>

        <div class="form-group">
            <label>Quais serviços deseja hoje?</label>
            <div class="checkbox-group" id="caixinhas_servicos_dinamicos">
                 <p class="carregando-txt">A carregar serviços...</p>
            </div>
            <div id="resumo-pedido" class="resumo-box">
                <p>Total Estimado: <strong id="total-valor">R$ 0</strong></p>
                <p>Tempo Estimado: <strong id="total-tempo">0 min</strong></p>
            </div>
            <input type="hidden" id="duracao_total" value="0">
            <input type="hidden" id="valor_total_enviar" value="0">
        </div>

        <div class="form-group">
            <label for="profissional">Profissional de Preferência:</label>
            <select id="profissional" required onchange="verificarHorarios()">
                <option value="" disabled selected>A carregar profissionais...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="data">Data de Preferência:</label>
            <input type="date" id="data" required onchange="verificarHorarios()">
        </div>

        <div class="form-group">
            <label for="hora">Horário de Preferência:</label>
            <select id="hora" required disabled>
                <option value="" disabled selected>Selecione a data primeiro...</option>
            </select>
        </div>

        <button type="submit" id="btnSubmit" class="btn-gold">Confirmar Agendamento</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxbj0EtBYyEYBw1-d8TdA_Rd6bLN6fn893aG6YF12Gp99D8ME4jr7ZKjViCKV-q27C7DQ/exec';
    
    const urlParams = new URLSearchParams(window.location.search);
    let idBarbearia = urlParams.get('id') || localStorage.getItem('id_barbearia_ativo') || 'kiko_barb';
    let telUrl = urlParams.get('tel');
    let numeroWhatsappDono = "5567999673200";
    let agendamentosDaNuvem = [];
    let configHorarios = null;

    if (telUrl) {
        document.getElementById('telefone').value = telUrl;
        mascaraTelefone(document.getElementById('telefone'));
    }

    window.onload = function() {
        let hoje = new Date().toISOString().split('T')[0];
        document.getElementById('data').setAttribute('min', hoje);
        document.getElementById('data').value = hoje;

        fetch(scriptURL + "?acao=obter_textos&id_barbearia=" + idBarbearia)
            .then(res => res.json())
            .then(textos => {
                if (textos.titulo) {
                    document.getElementById('titulo-empresa').innerText = textos.titulo;
                    document.title = textos.titulo + " | Agendamento Rápido";
                }
                if (textos.telefone) numeroWhatsappDono = textos.telefone.replace(/\D/g, '');

                if (textos.servicos && textos.servicos !== "[]") {
                    let listaServicos = JSON.parse(textos.servicos);
                    let htmlCaixas = "";
                    listaServicos.forEach(servico => {
                        let precoServ = servico.preco !== undefined ? servico.preco : (servico.valor !== undefined ? servico.valor : 0);
                        let tempoServ = servico.tempo !== undefined ? servico.tempo : (servico.duracao !== undefined ? servico.duracao : 20);
                        htmlCaixas += `<label class="checkbox-item"><input type="checkbox" name="servico" value="${servico.nome}" data-valor="${precoServ}" data-tempo="${tempoServ}" onchange="atualizarResumo()"><div class="checkbox-details"><span class="checkbox-title">${servico.nome} (${tempoServ}m)</span><span class="checkbox-price">R$ ${precoServ}</span></div></label>`;
                    });
                    document.getElementById('caixinhas_servicos_dinamicos').innerHTML = htmlCaixas;
                } else {
                    document.getElementById('caixinhas_servicos_dinamicos').innerHTML = "<p class='carregando-txt'>Nenhum serviço registado.</p>";
                }

                const selectProfissional = document.getElementById('profissional');
                selectProfissional.innerHTML = '<option value="" disabled selected>Selecione um profissional...</option>';
                if (textos.profissionais && textos.profissionais !== "[]") {
                    let listaProfissionais = JSON.parse(textos.profissionais);
                    listaProfissionais.forEach(prof => {
                        let opt = document.createElement('option');
                        opt.value = prof.nome;
                        opt.text = "💈 " + prof.nome;
                        selectProfissional.add(opt);
                    });
                } else {
                    let opt = document.createElement('option');
                    opt.value = "Equipe";
                    opt.text = "💈 Qualquer Barbeiro Disponível";
                    selectProfissional.add(opt);
                }
                
                configHorarios = textos.horarios ? JSON.parse(textos.horarios) : {};
                configHorarios.almoco_inicio = "11:40";
                configHorarios.almoco_fim = "13:00";
                if(!configHorarios.abre) configHorarios.abre = "08:00";
                if(!configHorarios.fecha) configHorarios.fecha = "19:40";
                if(!configHorarios.dias_abertos) configHorarios.dias_abertos = [1,2,3,4,5,6];

                verificarHorarios();
            })
            .catch(e => {
                configHorarios = { abre: "08:00", fecha: "19:40", almoco_inicio: "11:40", almoco_fim: "13:00", dias_abertos: [1,2,3,4,5,6] };
                document.getElementById('titulo-empresa').innerText = "KIKO BARBEARIA";
                verificarHorarios();
            });
    };

    function mascaraNascimento(input) {
        let v = input.value.replace(/\D/g, '');
        if (v.length > 4) v = v.substring(0, 4);
        if (v.length > 2) input.value = v.substring(0, 2) + '/' + v.substring(2, 4);
        else input.value = v;
    }

    function mascaraTelefone(input) {
        let val = input.value;
        if (val.startsWith('+55 ')) { val = val.substring(4); } 
        else if (val.startsWith('+55')) { val = val.substring(3); } 
        else if (val.startsWith('55') && val.length >= 12) { val = val.substring(2); }
        
        let v = val.replace(/\D/g, ''); 
        if (v.length > 11) v = v.substring(0, 11);

        let formatado = '';
        if (v.length > 0) { formatado = '+55 ' + v.substring(0, 2); }
        if (v.length > 2) { formatado += ' ' + v.substring(2, 7); }
        if (v.length > 7) { formatado += '-' + v.substring(7, 11); }
        
        input.value = formatado;

        // VERIFICA O CLIENTE QUANDO TERMINAR DE DIGITAR O NÚMERO
        if (v.length >= 10) {
            verificarClienteNuvem(v);
        }
    }

    function verificarClienteNuvem(telefoneNum) {
        fetch(scriptURL + "?acao=verificar_cliente&telefone=" + telefoneNum)
        .then(res => res.json())
        .then(data => {
            const caixaNasc = document.getElementById('campo_nascimento');
            const inputNasc = document.getElementById('data_nascimento');
            
            if (data.tem_aniversario) {
                // Cliente já existe, não precisa pedir data de nascimento
                caixaNasc.style.display = 'none';
                inputNasc.required = false;
                inputNasc.value = "";
            } else {
                // Cliente novo, exibe o campo suavemente
                caixaNasc.style.display = 'block';
                inputNasc.required = true;
            }
        })
        .catch(err => console.log("Não foi possível checar o cliente agora."));
    }

    function atualizarResumo() {
        let checkboxes = document.querySelectorAll('input[name="servico"]:checked');
        let totalV = 0, totalT = 0;
        checkboxes.forEach(cb => { totalV += parseInt(cb.getAttribute('data-valor')); totalT += parseInt(cb.getAttribute('data-tempo')); });
        
        document.getElementById('duracao_total').value = totalT; 
        document.getElementById('valor_total_enviar').value = totalV;
        
        const resumoBox = document.getElementById('resumo-pedido');
        if (totalT > 0) { 
            resumoBox.style.display = 'block'; 
            document.getElementById('total-valor').innerText = "R$ " + totalV; 
            document.getElementById('total-tempo').innerText = totalT + " min"; 
        } else { 
            resumoBox.style.display = 'none'; 
        }

        const dataEscolhida = document.getElementById('data').value;
        if (dataEscolhida && typeof agendamentosDaNuvem !== 'undefined') {
            renderizarDropdown(dataEscolhida, document.getElementById('hora'));
        }
    }

    function parseTempo(str) { let p = str.split(':'); return parseInt(p[0])*60 + parseInt(p[1]); }
    
    function verificarHorarios() {
        const dataEscolhida = document.getElementById('data').value;
        const profEscolhido = document.getElementById('profissional').value;

        if (!dataEscolhida || !profEscolhido) return;
        const selectHora = document.getElementById('hora');
        
        if(!configHorarios) {
            configHorarios = { abre: "08:00", fecha: "19:40", almoco_inicio: "11:40", almoco_fim: "13:00", dias_abertos: [1,2,3,4,5,6] };
        }

        const d = new Date(dataEscolhida + "T12:00:00"); const diaSemana = d.getDay(); 
        if (!configHorarios.dias_abertos.includes(diaSemana)) {
            selectHora.innerHTML = '<option value="" disabled selected>Fechado neste dia</option>'; selectHora.disabled = true; return;
        }

        selectHora.disabled = false; selectHora.innerHTML = '<option value="" disabled selected>A consultar agenda online...</option>';
        
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        window[callbackName] = function(data) {
            agendamentosDaNuvem = data;
            delete window[callbackName]; document.getElementById(callbackName)?.remove();
            renderizarDropdown(dataEscolhida, selectHora);
        };
        
        const script = document.createElement('script'); 
        script.id = callbackName; 
        script.src = scriptURL + '?data=' + dataEscolhida + '&id_barbearia=' + idBarbearia + '&profissional=' + encodeURIComponent(profEscolhido) + '&callback=' + callbackName;
        
        script.onerror = function() { renderizarDropdown(dataEscolhida, selectHora); };
        document.body.appendChild(script);
    }

    function renderizarDropdown(dataEscolhida, selectHora) {
        selectHora.innerHTML = '<option value="" disabled selected>Selecione um horário...</option>';
        let cur = parseTempo(configHorarios.abre); let end = parseTempo(configHorarios.fecha);
        let bStart = parseTempo(configHorarios.almoco_inicio || "11:40"); let bEnd = parseTempo(configHorarios.almoco_fim || "13:00");

        let agora = new Date();
        let hojeStr = agora.getFullYear() + "-" + ("0" + (agora.getMonth() + 1)).slice(-2) + "-" + ("0" + agora.getDate()).slice(-2);
        let horaAtualMinutos = agora.getHours() * 60 + agora.getMinutes();

        let duracaoMinutos = parseInt(document.getElementById('duracao_total').value) || 20;
        let blocosNecessarios = Math.ceil(duracaoMinutos / 20);

        const profEscolhido = (document.getElementById('profissional').value || "").trim().toLowerCase();
        let agendamentosFiltrados = Array.isArray(agendamentosDaNuvem) ? agendamentosDaNuvem.filter(ag => {
            if (!ag.profissional) return true; 
            let pAg = ag.profissional.trim().toLowerCase();
            if (profEscolhido === "" || profEscolhido === "equipe" || pAg === "equipe" || pAg === "sistema") return true;
            return pAg === profEscolhido;
        }) : [];

        let mapaSlots = {};
        for (let c = cur; c <= end; c += 20) {
            let hStr = Math.floor(c/60).toString().padStart(2,'0') + ":" + (c%60).toString().padStart(2,'0');
            let ocupado = false;
            let motivo = "";

            if (dataEscolhida === hojeStr && c <= horaAtualMinutos) {
                ocupado = true; motivo = "Passado";
            } else if (c >= bStart && c < bEnd) {
                ocupado = true; motivo = "Almoço";
            } else {
                ocupado = agendamentosFiltrados.some(ag => String(ag.data) === String(dataEscolhida) && String(ag.hora).trim() === hStr);
                if(ocupado) motivo = "Ocupado";
            }
            mapaSlots[c] = { hora: hStr, ocupado: ocupado, motivo: motivo };
        }

        let todosHorarios = [];
        for (let c = cur; c <= end; c += 20) {
            let hStr = mapaSlots[c].hora;

            if (mapaSlots[c].ocupado) {
                todosHorarios.push({ hora: hStr, ocupado: true, motivo: mapaSlots[c].motivo });
            } else {
                let cabe = true;
                for (let b = 1; b < blocosNecessarios; b++) {
                    let nextC = c + (b * 20);
                    if (!mapaSlots[nextC] || mapaSlots[nextC].ocupado) {
                        cabe = false;
                        break;
                    }
                }

                if (cabe) {
                    todosHorarios.push({ hora: hStr, ocupado: false, motivo: "" });
                } else {
                    todosHorarios.push({ hora: hStr, ocupado: true, motivo: "Espaço insuf." });
                }
            }
        }

        todosHorarios.forEach(item => {
            const opt = document.createElement('option'); opt.value = item.hora;
            if(item.ocupado) {
                opt.text = item.hora + " (" + item.motivo + ")";
                opt.disabled = true;
                opt.style.color = "#ff4444";
            } else {
                opt.text = item.hora;
            }
            selectHora.add(opt);
        });
    }

    document.getElementById('formAgendamento').addEventListener('submit', e => {
        e.preventDefault();
        if(document.querySelectorAll('input[name="servico"]:checked').length === 0) { alert("Selecione um serviço!"); return; }
        
        const btnSubmit = document.getElementById('btnSubmit');
        btnSubmit.disabled = true; 
        btnSubmit.innerText = "Aguarde, a agendar...";
        
        let nomes = []; 
        document.querySelectorAll('input[name="servico"]:checked').forEach(cb => nomes.push(cb.value));
        let valorFinal = document.getElementById('valor_total_enviar').value;
        let duracaoFinal = document.getElementById('duracao_total').value;
        let profFinal = document.getElementById('profissional').value;
        let dataNascFinal = document.getElementById('data_nascimento').value || ""; // PEGA A DATA SE EXISTIR

        const fd = new URLSearchParams();
        fd.append('acao', 'agendar');
        fd.append('id_barbearia', idBarbearia);
        fd.append('nome', document.getElementById('nome').value);
        fd.append('email', '');
        fd.append('telefone', document.getElementById('telefone').value.replace(/\D/g, ''));
        fd.append('data_nascimento', dataNascFinal); // ENVIA PARA O BACKEND
        fd.append('data', document.getElementById('data').value);
        fd.append('hora', document.getElementById('hora').value);
        fd.append('servico', nomes.join(" + "));
        fd.append('valor_total', valorFinal);
        fd.append('duracao_total', duracaoFinal);
        fd.append('profissional', profFinal);

        fetch(scriptURL, { method: 'POST', body: fd.toString(), mode: 'no-cors' })
        .then(() => {
            alert("✅ Agendamento realizado com sucesso!\nA confirmação e os detalhes foram enviados para o seu WhatsApp.");
            
            window.location.href = "https://wa.me/" + numeroWhatsappDono;

            setTimeout(() => { 
                window.open('','_self').close(); 
                window.close(); 
            }, 800);

            document.body.innerHTML = `
                <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; padding: 20px; font-family: 'Montserrat', sans-serif; background-color: #050505;">
                    <h1 style="color: #d4af37; font-size: 2.2em; margin-bottom: 10px;">VAGA GARANTIDA! ✂️</h1>
                    <p style="color: #fff; font-size: 1.1em; margin-bottom: 30px;">O seu horário foi marcado com sucesso e o nosso assistente já enviou a confirmação no seu WhatsApp.</p>
                    <p style="color: #888; font-size: 0.9em;">Pode fechar esta aba e voltar ao WhatsApp.</p>
                </div>
            `;
        })
        .catch(() => {
            alert("⚠️ Ocorreu um erro ao processar o agendamento. Tente novamente.");
            btnSubmit.disabled = false;
            btnSubmit.innerText = "Confirmar Agendamento";
        });
    });
</script>

</body>
</html>
