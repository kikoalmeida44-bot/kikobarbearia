<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Rápido</title>
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #121212; color: #f5f5f5; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h3 { text-align: center; color: #d4af37; margin-bottom: 5px; }
        .subtitulo { text-align: center; font-size: 12px; color: #888; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #ccc; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .lista-horarios { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; max-height: 180px; overflow-y: auto; }
        .btn-horario { background: #2a2a2a; border: 1px solid #d4af37; color: #d4af37; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; flex: 1 1 22%; text-align: center; }
        .btn-horario.selecionado, .btn-horario:hover { background: #d4af37; color: #121212; font-weight: bold; }
        .resumo { margin-top: 20px; background: #252525; padding: 12px; border-radius: 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .btn-confirmar { width: 100%; margin-top: 20px; background: #d4af37; color: #121212; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .btn-confirmar:hover { background: #c19b2e; }
        .carregando { color: #d4af37; font-size: 13px; font-style: italic; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h3 id="titulo-empresa">A CARREGAR...</h3>
    <div class="subtitulo">Agendamento Rápido</div>

    <form id="form-agendamento" onsubmit="enviarAgendamento(event)">
        <label>SEU NOME</label>
        <input type="text" id="nome" placeholder="Digite seu nome completo" required>

        <label>SEU WHATSAPP</label>
        <input type="tel" id="telefone" placeholder="5567999999999" required>

        <label>O QUE VAMOS FAZER?</label>
        <select id="servico" onchange="atualizarResumo()" required>
            <option value="">A carregar serviços...</option>
        </select>

        <label>PROFISSIONAL</label>
        <select id="profissional" onchange="mudarProfissional()" required>
            <option value="Equipe">Equipe</option>
        </select>

        <label>PARA QUANDO?</label>
        <input type="date" id="data" onchange="carregarHorarios()" required>

        <label>HORÁRIOS LIVRES</label>
        <div id="lista-horarios" class="lista-horarios">
            <span class="carregando">Selecione uma data acima.</span>
        </div>

        <div class="resumo">
            <div>
                <span style="font-size: 12px; color: #aaa;">Tempo estimado</span><br>
                <strong id="lbl-tempo">0 min</strong>
            </div>
            <div style="text-align: right;">
                <span style="font-size: 12px; color: #aaa;">Total</span><br>
                <strong id="lbl-valor" style="color: #d4af37; font-size: 18px;">R$ 0,00</strong>
            </div>
        </div>

        <button type="submit" class="btn-confirmar">CONFIRMAR AGENDAMENTO</button>
    </form>
</div>

<script>
    // URL DO SEU GOOGLE APPS SCRIPT
    const URL_SCRIPT = "https://script.google.com/macros/s/SEU_ID_DO_APPS_SCRIPT_AQUI/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const idBarbearia = urlParams.get('id') || 'kiko_barb';
    const telUrl = urlParams.get('tel');

    if (telUrl) {
        document.getElementById('telefone').value = telUrl;
    }

    // Define a data de hoje por padrão no input de data
    const hojeIso = new Date().toISOString().split('T')[0];
    document.getElementById('data').value = hojeIso;
    document.getElementById('data').min = hojeIso;

    let servicosGlobal = [];
    let horaSelecionada = null;

    function carregarDadosIniciais() {
        fetch(`${URL_SCRIPT}?acao=obter_textos&id_barbearia=${idBarbearia}`)
            .then(res => res.json())
            .then(data => {
                if (data.titulo) {
                    document.getElementById('titulo-empresa').innerText = data.titulo.toUpperCase();
                    document.title = data.titulo;
                }

                try {
                    servicosGlobal = typeof data.servicos === 'string' ? JSON.parse(data.servicos) : data.servicos;
                } catch(e) {
                    servicosGlobal = [{nome: "Corte", valor: 35, duracao: 20}];
                }

                let selServico = document.getElementById('servico');
                selServico.innerHTML = '<option value="">Selecione o serviço...</option>';
                servicosGlobal.forEach(s => {
                    let opt = document.createElement('option');
                    opt.value = s.nome;
                    opt.setAttribute('data-valor', s.valor || s.preco || 0);
                    opt.setAttribute('data-duracao', s.duracao || 20);
                    opt.text = `${s.nome} - R$ ${Number(s.valor || s.preco || 0).toFixed(2)}`;
                    selServico.appendChild(opt);
                });

                let profs = [];
                try {
                    profs = typeof data.profissionais === 'string' ? JSON.parse(data.profissionais) : data.profissionais;
                } catch(e) { profs = [{nome: "Equipe"}]; }

                let selProf = document.getElementById('profissional');
                selProf.innerHTML = '';
                profs.forEach(p => {
                    let opt = document.createElement('option');
                    opt.value = p.nome;
                    opt.text = p.nome;
                    selProf.appendChild(opt);
                });

                carregarHorarios();
            })
            .catch(err => {
                console.error("Erro ao carregar do Apps Script:", err);
                document.getElementById('titulo-empresa').innerText = "ERRO DE CONEXÃO";
            });
    }

    function atualizarResumo() {
        let sel = document.getElementById('servico');
        let opt = sel.options[sel.selectedIndex];
        if (!opt || !opt.value) {
            document.getElementById('lbl-tempo').innerText = "0 min";
            document.getElementById('lbl-valor').innerText = "R$ 0,00";
            return;
        }
        let valor = parseFloat(opt.getAttribute('data-valor')) || 0;
        let duracao = parseInt(opt.getAttribute('data-duracao')) || 20;

        document.getElementById('lbl-tempo').innerText = duracao + " min";
        document.getElementById('lbl-valor').innerText = "R$ " + valor.toFixed(2);
        carregarHorarios();
    }

    function mudarProfissional() {
        carregarHorarios();
    }

    function carregarHorarios() {
        let dataVal = document.getElementById('data').value;
        let profVal = document.getElementById('profissional').value || 'Equipe';
        let divHorarios = document.getElementById('lista-horarios');
        
        divHorarios.innerHTML = '<span class="carregando">A carregar horários...</span>';
        horaSelecionada = null;

        fetch(`${URL_SCRIPT}?data=${dataVal}&id_barbearia=${idBarbearia}&profissional=${encodeURIComponent(profVal)}`)
            .then(res => res.json())
            .then(horarios => {
                divHorarios.innerHTML = '';
                if (!horarios || horarios.length === 0) {
                    divHorarios.innerHTML = '<span style="color:#ff6b6b; font-size:13px;">Sem horários livres nesta data.</span>';
                    return;
                }

                horarios.forEach(h => {
                    let btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'btn-horario';
                    btn.innerText = h;
                    btn.onclick = () => {
                        document.querySelectorAll('.btn-horario').forEach(b => b.classList.remove('selecionado'));
                        btn.classList.add('selecionado');
                        horaSelecionada = h;
                    };
                    divHorarios.appendChild(btn);
                });
            })
            .catch(err => {
                divHorarios.innerHTML = '<span style="color:#ff6b6b; font-size:13px;">Erro ao buscar horários.</span>';
            });
    }

    function enviarAgendamento(e) {
        e.preventDefault();
        if (!horaSelecionada) {
            alert("Por favor, selecione um horário livre!");
            return;
        }

        let sel = document.getElementById('servico');
        let opt = sel.options[sel.selectedIndex];
        let nomeServico = sel.value;
        let valorServico = opt.getAttribute('data-valor');
        let duracaoServico = opt.getAttribute('data-duracao');

        let payload = {
            id_barbearia: idBarbearia,
            nome: document.getElementById('nome').value,
            telefone: document.getElementById('telefone').value,
            servico: nomeServico,
            valor_total: valorServico,
            duracao: duracaoServico,
            profissional: document.getElementById('profissional').value,
            data: document.getElementById('data').value,
            hora: horaSelecionada
        };

        let btnSub = document.querySelector('.btn-confirmar');
        btnSub.innerText = "A AGENDAR...";
        btnSub.disabled = true;

        fetch(URL_SCRIPT, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
            if (res.result === "success" || res.status === "sucesso") {
                alert("Agendamento realizado com sucesso!");
                window.location.reload();
            } else {
                alert("Erro ao agendar: " + (res.msg || "Horário indisponível"));
                btnSub.innerText = "CONFIRMAR AGENDAMENTO";
                btnSub.disabled = false;
            }
        })
        .catch(err => {
            alert("Agendamento enviado com sucesso!");
            window.location.reload();
        });
    }

    window.onload = carregarDadosIniciais;
</script>

</body>
</html>
