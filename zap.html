<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Rápido | WhatsApp</title>
    
    <!-- ACELERADORES DE CONEXÃO -->
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- META TAGS DO SISTEMA SAAS PARA WHATSAPP -->
    <meta property="og:title" content="Agendamento Online | Rápido e Fácil">
    <meta property="og:description" content="Garanta o seu horário com total comodidade. Escolha o melhor dia e profissional sem filas!">
    <meta property="og:image" content="https://i.postimg.cc/284FR3yL/Modelo-3D-para-agendamento-2-Nov-2026-6-16-pm-20261102-181712-0000.png">
    <meta property="og:type" content="website">

    <!-- Configuração do Favicon -->
    <link rel="icon" href="https://i.postimg.cc/284FR3yL/Modelo-3D-para-agendamento-2-Nov-2026-6-16-pm-20261102-181712-0000.png" type="image/png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/284FR3yL/Modelo-3D-para-agendamento-2-Nov-2026-6-16-pm-20261102-181712-0000.png">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cor-principal: #d4af37;
            --cor-fundo: #050505;
            --cor-borda: rgba(212, 175, 55, 0.35);
            --fonte-principal: 'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: var(--fonte-principal); 
            margin: 0; padding: 20px 12px; color: #ffffff; 
            background-color: var(--cor-fundo);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* VÍDEO DE FUNDO IMERSIVO EM TELA CHEIA */
        .video-background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -3;
            overflow: hidden;
            background-color: #050505;
        }

        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100vw;
            min-height: 100vh;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
            z-index: -3;
        }
        
        .overlay-global { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: linear-gradient(to bottom, rgba(5,5,5,0.5) 0%, rgba(5,5,5,0.75) 100%); 
            z-index: -2; 
            pointer-events: none;
        }

        /* LOGO KBS DISCRETA NO CANTINHO */
        .kbs-selo-cantinho {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .kbs-selo-cantinho img {
            width: 18px;
            height: 18px;
            object-fit: contain;
            border-radius: 4px;
        }
        .kbs-selo-cantinho span {
            font-size: 9px;
            color: var(--cor-principal);
            letter-spacing: 1px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* BARRA DE PROGRESSO ESTILO FLOW */
        .flow-progress-wrap {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 18px;
        }
        .flow-progress-bar {
            height: 100%;
            width: 25%;
            background: var(--cor-principal);
            transition: width 0.18s ease-out;
        }

        /* JANELA 100% CRISTALINA */
        .container { 
            width: 100%; max-width: 480px; margin: 10px auto; 
            background: rgba(5, 5, 5, 0.14);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 38px 24px 28px 24px; 
            border-radius: 20px; 
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        h3 { text-align: center; color: var(--cor-principal); text-transform: uppercase; letter-spacing: 3px; margin: 0 0 6px 0; font-size: 1.5em; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
        .subtitulo { text-align: center; font-size: 11px; color: #d0d0d0; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
        
        .form-group { margin-bottom: 20px; transition: border-color 0.15s ease, background 0.15s ease; }
        .form-group label { display: block; margin-bottom: 8px; color: #f0f0f0; font-size: 0.8em; text-transform: uppercase; font-weight: 700; letter-spacing: 0.8px; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
        
        .form-group input, .form-group select { 
            width: 100%; padding: 14px 16px; 
            background: rgba(0, 0, 0, 0.35);
            color: #ffffff; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 12px; font-family: var(--fonte-principal); font-size: 15px; transition: border-color 0.15s ease, background 0.15s ease;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--cor-principal); box-shadow: 0 0 12px var(--cor-borda); outline: none; background: rgba(0, 0, 0, 0.55); }

        .checkbox-group { display: flex; flex-direction: column; gap: 10px; max-height: 220px; overflow-y: auto; background: rgba(0, 0, 0, 0.2); padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .checkbox-group::-webkit-scrollbar { width: 6px; }
        .checkbox-group::-webkit-scrollbar-thumb { background: var(--cor-borda); border-radius: 10px; }
        
        .checkbox-item { display: flex; align-items: center; background: rgba(255, 255, 255, 0.04); padding: 13px 15px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; cursor: pointer; transition: transform 0.1s ease, border-color 0.12s ease, background 0.12s ease; }
        .checkbox-item:hover { border-color: var(--cor-principal); background: rgba(212, 175, 55, 0.12); }
        .checkbox-item:active { transform: scale(0.985); }
        .checkbox-item.selecionado { border-color: var(--cor-principal); background: rgba(212, 175, 55, 0.18); }
        .checkbox-item input { margin-right: 14px; transform: scale(1.3); accent-color: var(--cor-principal); cursor: pointer; }
        .checkbox-details { display: flex; justify-content: space-between; flex-grow: 1; align-items: center; }
        .checkbox-title { font-weight: 600; color: #fff; font-size: 0.9em; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .checkbox-price { color: var(--cor-principal); font-weight: 700; font-size: 0.95em; }

        .resumo-box { margin-top: 14px; padding: 14px 16px; background: rgba(0, 0, 0, 0.38); border: 1px solid var(--cor-borda); border-left: 4px solid var(--cor-principal); display: none; border-radius: 10px; }
        .resumo-box p { margin: 4px 0; font-size: 0.92em; color: #e0e0e0; }
        .resumo-box strong { color: var(--cor-principal); }

        .btn-gold { background: var(--cor-principal); color: #050505; width: 100%; padding: 16px; font-size: 1em; font-weight: 800; text-transform: uppercase; border-radius: 12px; border: none; cursor: pointer; font-family: var(--fonte-principal); margin-top: 15px; letter-spacing: 1px; box-shadow: 0 4px 20px var(--cor-borda); transition: transform 0.12s ease, filter 0.12s ease; }
        .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 6px 25px var(--cor-borda); filter: brightness(1.08); }
        .btn-gold:active { transform: scale(0.985); }
        .btn-gold:disabled { opacity: 0.6; cursor: not-allowed; transform: none; filter: grayscale(50%); }
        
        #campo_nascimento { display: none; }

        /* SKELETON LOADING */
        @keyframes shimmer {
            0% { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }
        .skeleton {
            background-color: rgba(255, 255, 255, 0.05);
            background-image: linear-gradient(90deg, rgba(255,255,255,0.0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.0) 100%);
            background-repeat: no-repeat;
            background-size: 800px 100%;
            animation: shimmer 1.2s infinite linear;
            border-radius: 8px;
        }
        .skel-title { width: 70%; height: 28px; margin: 0 auto; border-radius: 4px; }
        .skel-sub { width: 50%; height: 12px; margin: 6px auto 0 auto; border-radius: 4px; }
        .skel-checkbox { display: flex; align-items: center; padding: 13px 15px; background: rgba(255, 255, 255, 0.02); border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .skel-box { width: 22px; height: 22px; border-radius: 4px; margin-right: 14px; }
        .skel-line-main { width: 50%; height: 16px; border-radius: 4px; }
        .skel-line-price { width: 20%; height: 16px; border-radius: 4px; margin-left: auto; }

        /* ANIMAÇÃO DE ABERTURA RÁPIDA ESTILO FLOW */
        @keyframes nascerFlow {
            0% { transform: translateY(10px) scale(0.98); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animacao-abertura-app {
            opacity: 0;
            animation: nascerFlow 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transform-origin: center center; 
        }

        .tela-confirmacao-flow {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 75vh;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            text-align: center;
            padding: 28px 22px;
            background: rgba(10, 10, 10, 0.78);
            border: 1px solid var(--cor-borda);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .card-resumo-flow {
            width: 100%;
            text-align: left;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 16px;
            margin: 18px 0 22px 0;
            line-height: 1.65;
            font-size: 0.94em;
        }
    </style>
</head>
<body>

    <!-- VÍDEO DE FUNDO DINÂMICO -->
    <div class="video-background-container">
        <video autoplay muted loop playsinline id="bg-video">
            Seu navegador não suporta vídeos em HTML5.
        </video>
    </div>
    
    <div class="overlay-global"></div>

<div class="container animacao-abertura-app" id="appContainer">
    <!-- LOGO KBS DISCRETA NO CANTO -->
    <div class="kbs-selo-cantinho">
        <img src="https://i.postimg.cc/0jcXj8Dd/Icone-kbs-em-3D-2-Nov-2026-11-08-am-20261102-110816-0000.png" alt="KBS">
        <span>KBS</span>
    </div>

    <div class="flow-progress-wrap" aria-hidden="true">
        <div class="flow-progress-bar" id="flowProgressBar"></div>
    </div>

    <h3 id="titulo-empresa"><div class="skeleton skel-title"></div></h3>
    <div class="subtitulo" id="subtitulo-empresa"><div class="skeleton skel-sub"></div></div>

    <form id="formAgendamento">
        <div class="form-group">
            <label for="nome">O Seu Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome completo" required oninput="atualizarProgressoFlow()">
        </div>

        <div class="form-group">
            <label for="telefone">O Seu WhatsApp (Com DDD):</label>
            <input type="tel" id="telefone" placeholder="+55 (67) 99999-9999" required oninput="mascaraTelefone(this); atualizarProgressoFlow();" maxlength="19">
        </div>

        <div class="form-group" id="campo_nascimento">
            <label for="data_nascimento">Data de Nascimento (Para ganhar presentes 🎉):</label>
            <input type="text" id="data_nascimento" placeholder="Ex: 15/08" maxlength="5" oninput="mascaraNascimento(this)">
        </div>

        <div class="form-group">
            <label>Quais serviços deseja hoje?</label>
            <div class="checkbox-group" id="caixinhas_servicos_dinamicos">
                 <div class="skel-checkbox"><div class="skeleton skel-box"></div><div class="skeleton skel-line-main"></div><div class="skeleton skel-line-price"></div></div>
                 <div class="skel-checkbox"><div class="skeleton skel-box"></div><div class="skeleton skel-line-main"></div><div class="skeleton skel-line-price"></div></div>
                 <div class="skel-checkbox"><div class="skeleton skel-box"></div><div class="skeleton skel-line-main"></div><div class="skeleton skel-line-price"></div></div>
            </div>
            <div id="resumo-pedido" class="resumo-box">
                <p>Total Estimado: <strong id="total-valor">R$ 0</strong></p>
                <p>Tempo Estimado: <strong id="total-tempo">0 min</strong></p>
            </div>
            <input type="hidden" id="duracao_total" value="0">
            <input type="hidden" id="valor_total_enviar" value="0">
        </div>

        <div class="form-group">
            <label for="profissional">Profissional de Preferência:</label>
            <select id="profissional" required onchange="verificarHorarios(); atualizarProgressoFlow();">
                <option value="" disabled selected>Selecione um profissional...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="data">Data de Preferência:</label>
            <input type="date" id="data" required onchange="verificarHorarios(); atualizarProgressoFlow();">
        </div>

        <div class="form-group">
            <label for="hora">Horário de Preferência:</label>
            <select id="hora" required disabled onchange="atualizarProgressoFlow()">
                <option value="" disabled selected>Selecione a data primeiro...</option>
            </select>
        </div>

        <button type="submit" id="btnSubmit" class="btn-gold">Confirmar Agendamento</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxbj0EtBYyEYBw1-d8TdA_Rd6bLN6fn893aG6YF12Gp99D8ME4jr7ZKjViCKV-q27C7DQ/exec';
    
    function detectarIdBarbeariaSaaS() {
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id') || urlParams.get('id_barbearia');
        if (idParam) return idParam.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');

        const host = window.location.hostname.toLowerCase();
        const partes = host.split('.');
        if (partes.length >= 3 && partes[0] !== 'www' && partes[0] !== 'kikobarbearia' && !host.endsWith('github.io') && !host.endsWith('workers.dev')) {
            return partes[0].replace(/[^a-z0-9_-]/g, '');
        }
        return 'kiko_barb';
    }

    const urlParams = new URLSearchParams(window.location.search);
    let idBarbearia = detectarIdBarbeariaSaaS();
    let telUrl = urlParams.get('tel');
    let numeroWhatsappDono = "5567999673200"; 
    let agendamentosDaNuvem = [];
    let configHorarios = null;
    window.listaProfissionaisGlobal = [];

    const chaveCache = "kbs_cache_" + idBarbearia;
    const chaveClienteLocal = "kbs_cliente_flow_" + idBarbearia;
    const chaveVideoLocal = "kbs_video_flow_" + idBarbearia;

    function atualizarProgressoFlow() {
        let pontos = 1;
        if ((document.getElementById('nome')?.value || '').trim().length >= 2) pontos++;
        if (document.querySelectorAll('input[name="servico"]:checked').length > 0) pontos++;
        if (document.getElementById('profissional')?.value && document.getElementById('hora')?.value) pontos++;
        const perc = Math.min(100, pontos * 25);
        const bar = document.getElementById('flowProgressBar');
        if (bar) bar.style.width = perc + '%';
    }

    function aplicarVideoFundo(linkVideo) {
        if (!linkVideo) return;
        const videoBg = document.getElementById('bg-video');
        if (!videoBg) return;
        const atual = videoBg.querySelector('source')?.getAttribute('src');
        if (atual === linkVideo) return;
        videoBg.innerHTML = `<source src="${linkVideo}" type="video/mp4">`;
        videoBg.load();
    }

    function montarTela(textos) {
        if (!textos) return;
        if (textos.cor_primaria) {
            document.documentElement.style.setProperty('--cor-principal', textos.cor_primaria);
            document.documentElement.style.setProperty('--cor-borda', textos.cor_primaria + '35');
        }
        if (textos.fonte_texto && textos.fonte_texto !== "Roboto") {
            const fontId = 'font_kbs_' + textos.fonte_texto.replace(/[^a-zA-Z0-9]/g, '');
            document.documentElement.style.setProperty('--fonte-principal', `'${textos.fonte_texto}', sans-serif`);
            if (!document.getElementById(fontId)) {
                const linkFont = document.createElement('link');
                linkFont.id = fontId;
                linkFont.href = `https://fonts.googleapis.com/css2?family=${textos.fonte_texto.replace(/ /g, '+')}:wght@400;600;700;800&display=swap`;
                linkFont.rel = 'stylesheet';
                document.head.appendChild(linkFont);
            }
        }

        if (textos.titulo) {
            document.getElementById('titulo-empresa').innerText = textos.titulo;
            document.getElementById('subtitulo-empresa').innerText = "Agendamento Rápido via WhatsApp";
            document.title = textos.titulo + " | Agendamento Rápido";
        }
        if (textos.telefone) numeroWhatsappDono = textos.telefone.replace(/\D/g, '');

        const marcacoesAtuais = new Set(
            Array.from(document.querySelectorAll('input[name="servico"]:checked')).map(cb => cb.value)
        );

        if (textos.servicos && textos.servicos !== "[]") {
            let listaServicos = JSON.parse(textos.servicos);
            let htmlCaixas = "";
            listaServicos.forEach(servico => {
                let precoServ = servico.preco !== undefined ? servico.preco : (servico.valor !== undefined ? servico.valor : 0);
                let tempoServ = servico.tempo !== undefined ? servico.tempo : (servico.duracao !== undefined ? servico.duracao : 20);
                const checkedAttr = marcacoesAtuais.has(servico.nome) ? 'checked' : '';
                const selClass = marcacoesAtuais.has(servico.nome) ? 'selecionado' : '';
                htmlCaixas += `<label class="checkbox-item ${selClass}"><input type="checkbox" name="servico" value="${servico.nome}" data-valor="${precoServ}" data-tempo="${tempoServ}" ${checkedAttr} onchange="atualizarResumo(); atualizarProgressoFlow();"><div class="checkbox-details"><span class="checkbox-title">${servico.nome} (${tempoServ}m)</span><span class="checkbox-price">R$ ${precoServ}</span></div></label>`;
            });
            document.getElementById('caixinhas_servicos_dinamicos').innerHTML = htmlCaixas;
        } else {
            document.getElementById('caixinhas_servicos_dinamicos').innerHTML = "<p style='text-align:center; color:#888;'>Nenhum serviço registado.</p>";
        }

        const selectProfissional = document.getElementById('profissional');
        const profAnterior = selectProfissional.value;
        selectProfissional.innerHTML = '<option value="" disabled selected>Selecione um profissional...</option>';
        if (textos.profissionais && textos.profissionais !== "[]") {
            window.listaProfissionaisGlobal = JSON.parse(textos.profissionais);
            window.listaProfissionaisGlobal.forEach(prof => {
                let opt = document.createElement('option');
                opt.value = prof.nome;
                opt.text = "💈 " + prof.nome;
                if (prof.nome === profAnterior) opt.selected = true;
                selectProfissional.add(opt);
            });
        } else {
            let opt = document.createElement('option');
            opt.value = "Equipe";
            opt.text = "💈 Qualquer Barbeiro Disponível";
            if (profAnterior === "Equipe") opt.selected = true;
            selectProfissional.add(opt);
        }
        
        configHorarios = textos.horarios ? JSON.parse(textos.horarios) : {};
        if(!configHorarios.almoco_inicio) configHorarios.almoco_inicio = "11:40";
        if(!configHorarios.almoco_fim) configHorarios.almoco_fim = "13:00";
        if(!configHorarios.abre) configHorarios.abre = "08:00";
        if(!configHorarios.fecha) configHorarios.fecha = "19:40";
        if(!configHorarios.dias_abertos) configHorarios.dias_abertos = [1,2,3,4,5,6];

        atualizarResumo();
        verificarHorarios();
        atualizarProgressoFlow();
    }

    (function initInstantaneoFlow() {
        let hoje = new Date().toISOString().split('T')[0];
        const inputData = document.getElementById('data');
        inputData.setAttribute('min', hoje);
        inputData.value = hoje;

        const videoSalvo = localStorage.getItem(chaveVideoLocal);
        if (videoSalvo) aplicarVideoFundo(videoSalvo);

        const clienteSalvoStr = localStorage.getItem(chaveClienteLocal);
        if (clienteSalvoStr) {
            try {
                const cli = JSON.parse(clienteSalvoStr);
                if (cli.nome && !document.getElementById('nome').value) {
                    document.getElementById('nome').value = cli.nome;
                }
                if (!telUrl && cli.telefone && !document.getElementById('telefone').value) {
                    document.getElementById('telefone').value = cli.telefone;
                    mascaraTelefone(document.getElementById('telefone'));
                }
            } catch(e) {}
        }

        if (telUrl) {
            document.getElementById('telefone').value = telUrl;
            mascaraTelefone(document.getElementById('telefone'));
        }

        const cacheSalvo = localStorage.getItem(chaveCache);
        if (cacheSalvo) {
            try { montarTela(JSON.parse(cacheSalvo)); } catch(e) {}
        }
    })();

    window.onload = function() {
        const cacheSalvo = localStorage.getItem(chaveCache);

        fetch(scriptURL + "?acao=obter_textos&id_barbearia=" + idBarbearia)
            .then(res => res.json())
            .then(textos => {
                localStorage.setItem(chaveCache, JSON.stringify(textos));
                montarTela(textos);
            })
            .catch(e => {
                if (!cacheSalvo) {
                    document.getElementById('titulo-empresa').innerText = "AGENDAMENTO ONLINE";
                    document.getElementById('subtitulo-empresa').innerText = "Agendamento Rápido via WhatsApp";
                    document.getElementById('caixinhas_servicos_dinamicos').innerHTML = "<p style='text-align:center; color:#ff4444;'>Erro ao carregar. Atualize a página.</p>";
                    configHorarios = { abre: "08:00", fecha: "19:40", almoco_inicio: "11:40", almoco_fim: "13:00", dias_abertos: [1,2,3,4,5,6] };
                    verificarHorarios();
                }
            });

        fetch(scriptURL + "?acao=obter_fotos&id_barbearia=" + idBarbearia)
        .then(res => res.json())
        .then(fotosBrutas => {
            let midiasSemRepetir = [...new Set(fotosBrutas)];
            for (let link of midiasSemRepetir) {
                let lkLower = link.toLowerCase();
                if (lkLower.includes('.mp4') || lkLower.includes('.webm') || lkLower.includes('video')) {
                    localStorage.setItem(chaveVideoLocal, link);
                    aplicarVideoFundo(link);
                    break;
                }
            }
        }).catch(e => console.error("Erro ao carregar vídeo:", e));
    };

    function mascaraNascimento(input) {
        let v = input.value.replace(/\D/g, '');
        if (v.length > 4) v = v.substring(0, 4);
        if (v.length > 2) input.value = v.substring(0, 2) + '/' + v.substring(2, 4);
        else input.value = v;
    }

    function mascaraTelefone(input) {
        let v = input.value.replace(/\D/g, '');
        if (v.startsWith('55') && v.length >= 12) {
            v = v.substring(2);
        } else if (v.startsWith('55') && input.value.indexOf('+55') > -1) {
            v = v.substring(2);
        }
        if (v.length === 10) {
            v = v.substring(0, 2) + '9' + v.substring(2);
        }
        if (v.length > 11) v = v.substring(0, 11);
        
        let formatado = '';
        if (v.length > 0) {
            formatado = '+55 ';
            if (v.length > 2) {
                formatado += '(' + v.substring(0, 2) + ') ';
                if (v.length === 11) {
                    formatado += v.substring(2, 7) + '-' + v.substring(7); 
                } else if (v.length > 6) {
                    formatado += v.substring(2, 6) + '-' + v.substring(6); 
                } else {
                    formatado += v.substring(2);
                }
            } else {
                formatado += v;
            }
        }
        input.value = formatado;
        if (v.length >= 10) verificarClienteNuvem(v);
    }

    function verificarClienteNuvem(telefoneNum) {
        fetch(scriptURL + "?acao=verificar_cliente&telefone=" + telefoneNum)
        .then(res => res.json())
        .then(data => {
            const caixaNasc = document.getElementById('campo_nascimento');
            const inputNasc = document.getElementById('data_nascimento');
            if (data.tem_aniversario) {
                caixaNasc.style.display = 'none';
                inputNasc.required = false;
                inputNasc.value = "";
            } else {
                caixaNasc.style.display = 'block';
                inputNasc.required = true;
            }
        })
        .catch(err => console.log("Não foi possível checar o cliente agora."));
    }

    function atualizarResumo() {
        let checkboxes = document.querySelectorAll('input[name="servico"]');
        let totalV = 0, totalT = 0;
        checkboxes.forEach(cb => {
            const labelEl = cb.closest('.checkbox-item');
            if (cb.checked) {
                totalV += parseInt(cb.getAttribute('data-valor'));
                totalT += parseInt(cb.getAttribute('data-tempo'));
                if (labelEl) labelEl.classList.add('selecionado');
            } else if (labelEl) {
                labelEl.classList.remove('selecionado');
            }
        });
        
        document.getElementById('duracao_total').value = totalT; 
        document.getElementById('valor_total_enviar').value = totalV;
        
        const resumoBox = document.getElementById('resumo-pedido');
        if (totalT > 0) { 
            resumoBox.style.display = 'block'; 
            document.getElementById('total-valor').innerText = "R$ " + totalV; 
            document.getElementById('total-tempo').innerText = totalT + " min"; 
        } else { 
            resumoBox.style.display = 'none'; 
        }

        const dataEscolhida = document.getElementById('data').value;
        if (dataEscolhida && typeof agendamentosDaNuvem !== 'undefined') {
            renderizarDropdown(dataEscolhida, document.getElementById('hora'));
        }
    }

    function parseTempo(str) { let p = str.split(':'); return parseInt(p[0])*60 + parseInt(p[1]); }
    
    function verificarHorarios() {
        const dataEscolhida = document.getElementById('data').value;
        const profEscolhido = document.getElementById('profissional').value;

        if (!dataEscolhida || !profEscolhido) return;
        const selectHora = document.getElementById('hora');
        
        if(!configHorarios) {
            configHorarios = { abre: "08:00", fecha: "19:40", almoco_inicio: "11:40", almoco_fim: "13:00", dias_abertos: [1,2,3,4,5,6] };
        }

        const d = new Date(dataEscolhida + "T12:00:00"); const diaSemana = d.getDay(); 
        if (!configHorarios.dias_abertos.includes(diaSemana)) {
            selectHora.innerHTML = '<option value="" disabled selected>Fechado neste dia</option>'; selectHora.disabled = true; return;
        }

        selectHora.disabled = false;
        renderizarDropdown(dataEscolhida, selectHora);
        
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        window[callbackName] = function(data) {
            agendamentosDaNuvem = data;
            delete window[callbackName]; document.getElementById(callbackName)?.remove();
            renderizarDropdown(dataEscolhida, selectHora);
        };
        
        const script = document.createElement('script'); 
        script.id = callbackName; 
        script.src = scriptURL + '?data=' + dataEscolhida + '&id_barbearia=' + idBarbearia + '&profissional=' + encodeURIComponent(profEscolhido) + '&callback=' + callbackName;
        script.onerror = function() { renderizarDropdown(dataEscolhida, selectHora); };
        document.body.appendChild(script);
    }

    function renderizarDropdown(dataEscolhida, selectHora) {
        const horaAnterior = selectHora.value;
        selectHora.innerHTML = '<option value="" disabled selected>Selecione um horário...</option>';
        
        let abreProf = configHorarios.abre || "08:00";
        let fechaProf = configHorarios.fecha || "19:40";

        const profEscolhido = (document.getElementById('profissional').value || "").trim();
        if (profEscolhido && profEscolhido !== "Equipe" && window.listaProfissionaisGlobal) {
            let pObj = window.listaProfissionaisGlobal.find(p => p.nome.trim().toLowerCase() === profEscolhido.toLowerCase());
            if (pObj) {
                if (pObj.abre) abreProf = pObj.abre;
                if (pObj.fecha) fechaProf = pObj.fecha;
            }
        }

        let cur = parseTempo(abreProf); 
        let end = parseTempo(fechaProf);
        let bStart = parseTempo(configHorarios.almoco_inicio || "11:40"); 
        let bEnd = parseTempo(configHorarios.almoco_fim || "13:00");

        let agora = new Date();
        let hojeStr = agora.getFullYear() + "-" + ("0" + (agora.getMonth() + 1)).slice(-2) + "-" + ("0" + agora.getDate()).slice(-2);
        let horaAtualMinutos = agora.getHours() * 60 + agora.getMinutes();

        let duracaoMinutos = parseInt(document.getElementById('duracao_total').value) || 20;
        let blocosNecessarios = Math.ceil(duracaoMinutos / 20);

        const profEscolhidoLower = profEscolhido.toLowerCase();
        let agendamentosFiltrados = Array.isArray(agendamentosDaNuvem) ? agendamentosDaNuvem.filter(ag => {
            if (!ag.profissional) return true; 
            let pAg = ag.profissional.trim().toLowerCase();
            if (profEscolhidoLower === "" || profEscolhidoLower === "equipe" || pAg === "equipe" || pAg === "sistema") return true;
            return pAg === profEscolhidoLower;
        }) : [];

        let mapaSlots = {};
        for (let c = cur; c <= end; c += 20) {
            let hStr = Math.floor(c/60).toString().padStart(2,'0') + ":" + (c%60).toString().padStart(2,'0');
            let ocupado = false;
            let motivo = "";

            if (dataEscolhida === hojeStr && c <= horaAtualMinutos) {
                ocupado = true; motivo = "Passado";
            } else if (c >= bStart && c < bEnd) {
                ocupado = true; motivo = "Almoço";
            } else {
                ocupado = agendamentosFiltrados.some(ag => String(ag.data) === String(dataEscolhida) && String(ag.hora).trim() === hStr);
                if(ocupado) motivo = "Ocupado";
            }
            mapaSlots[c] = { hora: hStr, ocupado: ocupado, motivo: motivo };
        }

        let todosHorarios = [];
        for (let c = cur; c <= end; c += 20) {
            let hStr = mapaSlots[c].hora;

            if (mapaSlots[c].ocupado) {
                todosHorarios.push({ hora: hStr, ocupado: true, motivo: mapaSlots[c].motivo });
            } else {
                let cabe = true;
                for (let b = 1; b < blocosNecessarios; b++) {
                    let nextC = c + (b * 20);
                    if (!mapaSlots[nextC] || mapaSlots[nextC].ocupado) {
                        cabe = false;
                        break;
                    }
                }

                if (cabe) {
                    todosHorarios.push({ hora: hStr, ocupado: false, motivo: "" });
                } else {
                    todosHorarios.push({ hora: hStr, ocupado: true, motivo: "Espaço insuf." });
                }
            }
        }

        todosHorarios.forEach(item => {
            const opt = document.createElement('option'); opt.value = item.hora;
            if(item.ocupado) {
                opt.text = item.hora + " (" + item.motivo + ")";
                opt.disabled = true;
                opt.style.color = "#ff4444";
            } else {
                opt.text = item.hora;
                if (horaAnterior && item.hora === horaAnterior) opt.selected = true;
            }
            selectHora.add(opt);
        });
    }

    document.getElementById('formAgendamento').addEventListener('submit', e => {
        e.preventDefault();
        if(document.querySelectorAll('input[name="servico"]:checked').length === 0) {
            alert("Selecione um serviço!");
            return;
        }
        if(!document.getElementById('hora').value) {
            alert("Selecione um horário disponível!");
            return;
        }
        
        const btnSubmit = document.getElementById('btnSubmit');
        btnSubmit.disabled = true; 
        
        let nomes = []; 
        document.querySelectorAll('input[name="servico"]:checked').forEach(cb => nomes.push(cb.value));
        const nomeCliente = document.getElementById('nome').value.trim();
        const telFormatado = document.getElementById('telefone').value.trim();
        const telLimpo = telFormatado.replace(/\D/g, '');
        const dataEscolhida = document.getElementById('data').value;
        const horaEscolhida = document.getElementById('hora').value;
        let valorFinal = document.getElementById('valor_total_enviar').value;
        let duracaoFinal = document.getElementById('duracao_total').value;
        let profFinal = document.getElementById('profissional').value;
        let dataNascFinal = document.getElementById('data_nascimento').value || "";
        const servicoResumo = nomes.join(" + ");

        try {
            localStorage.setItem(chaveClienteLocal, JSON.stringify({ nome: nomeCliente, telefone: telFormatado }));
        } catch(e) {}

        const fd = new URLSearchParams();
        fd.append('acao', 'agendar');
        fd.append('id_barbearia', idBarbearia);
        fd.append('nome', nomeCliente);
        fd.append('email', '');
        fd.append('telefone', telLimpo);
        fd.append('data_nascimento', dataNascFinal);
        fd.append('data', dataEscolhida);
        fd.append('hora', horaEscolhida);
        fd.append('servico', servicoResumo);
        fd.append('valor_total', valorFinal);
        fd.append('duracao_total', duracaoFinal);
        fd.append('profissional', profFinal);

        fetch(scriptURL, { method: 'POST', body: fd.toString(), mode: 'no-cors', keepalive: true })
            .catch(() => console.log("Envio em fila de rede..."));

        const dataBr = dataEscolhida ? dataEscolhida.split('-').reverse().join('/') : '';
        const linkZapVolta = "https://wa.me/" + numeroWhatsappDono;

        const overlayEl = document.querySelector('.overlay-global');
        const videoWrapEl = document.querySelector('.video-background-container');
        document.body.innerHTML = `
            ${videoWrapEl ? videoWrapEl.outerHTML : ''}
            ${overlayEl ? overlayEl.outerHTML : ''}
            <div class="tela-confirmacao-flow animacao-abertura-app">
                <h1 style="color: var(--cor-principal); font-size: 2em; margin: 0 0 8px 0;">VAGA GARANTIDA! ✂️</h1>
                <p style="color: #e5e5e5; font-size: 0.98em; margin: 0;">Voltando para o WhatsApp...</p>
                <div class="card-resumo-flow">
                    <div><strong>Cliente:</strong> ${nomeCliente}</div>
                    <div><strong>Data:</strong> ${dataBr} às <strong>${horaEscolhida}</strong></div>
                    <div><strong>Serviço:</strong> ${servicoResumo}</div>
                    <div><strong>Profissional:</strong> ${profFinal}</div>
                    <div><strong>Total:</strong> R$ ${valorFinal} (${duracaoFinal} min)</div>
                </div>
                <a href="${linkZapVolta}" class="btn-gold" style="text-decoration:none; display:block; text-align:center;">Abrir WhatsApp Agora</a>
            </div>
        `;

        setTimeout(() => {
            window.location.href = linkZapVolta;
        }, 450);

        setTimeout(() => {
            try {
                window.open('', '_self').close();
                window.close();
            } catch(errClose) {}
        }, 1200);
    });
</script>
