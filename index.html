<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiko Barbearia - Atendimento</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; text-align: center; padding-bottom: 50px;}
        
        /* CABEÇALHO */
        header { padding: 40px 20px; background-color: #111; border-bottom: 2px solid #c8a355; margin-bottom: 30px;}
        h1 { color: #c8a355; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; }
        p.sub { color: #aaa; font-size: 0.9rem; margin-top: 10px; }

        /* GALERIA DE FOTOS DO PAINEL */
        .galeria-container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
        .galeria-container h2 { color: #c8a355; font-size: 1.5rem; margin-bottom: 20px; text-transform: uppercase; }
        .galeria-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .galeria-grid img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; border: 1px solid #333; }
        
        #msg-carregando { color: #777; font-style: italic; }

        /* BOTÃO PARA ABRIR O ROBÔ */
        .btn-chamar-robo { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background-color: #25D366; color: white; padding: 15px 30px; border-radius: 30px; font-weight: bold; font-size: 1.1rem; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 1000; text-transform: uppercase; display: flex; align-items: center; gap: 10px;}
        .btn-chamar-robo:hover { background-color: #20b858; }

        /* A JANELA DO ROBÔ (TYPEBOT) */
        #typebot-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #0d0d0d; z-index: 2000; }
        .btn-fechar-robo { position: absolute; top: 15px; right: 20px; background: #333; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; z-index: 2001; font-weight: bold;}
    </style>
</head>
<body>

    <header>
        <h1>Kiko Barbearia</h1>
        <p class="sub">Rua da Barbearia, Coxim - MS | Especialistas em Cabelo e Barba</p>
    </header>

    <div class="galeria-container">
        <h2>Conheça os nossos trabalhos</h2>
        <p id="msg-carregando">A carregar fotos da barbearia...</p>
        <div class="galeria-grid" id="galeria-fotos">
            <!-- As fotos do seu painel vão aparecer aqui -->
        </div>
    </div>

    <!-- BOTÃO QUE CHAMA O SEU ASSISTENTE VIRTUAL -->
    <button class="btn-chamar-robo" onclick="abrirRobo()">
        📅 Falar com o Assistente
    </button>

    <!-- O SEU TYPEBOT FICA AQUI DENTRO ESCONDIDO ATÉ CLICAREM NO BOTÃO -->
    <div id="typebot-container">
        <button class="btn-fechar-robo" onclick="fecharRobo()">Voltar às Fotos</button>
        <typebot-standard style="width: 100%; height: 100%;"></typebot-standard>
    </div>

    <!-- SCRIPT PARA PUXAR AS FOTOS DO PAINEL -->
    <script>
        // Substitua pelo URL do seu Google Script
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwoFpOt-eXHQ-9utcqPp3R3i6eow2PYxvsSZKuJKiYEziND_xU6vz3kgA2q5zY4MePc/exec';
        
        async function carregarGaleria() {
            try {
                const resposta = await fetch(SCRIPT_URL + '?acao=obter_fotos');
                const fotos = await resposta.json();
                
                const divGaleria = document.getElementById('galeria-fotos');
                const msg = document.getElementById('msg-carregando');
                
                if (fotos && fotos.length > 0) {
                    msg.style.display = 'none';
                    fotos.forEach(link => {
                        divGaleria.innerHTML += `<img src="${link}" alt="Corte na Kiko Barbearia" loading="lazy">`;
                    });
                } else {
                    msg.innerText = 'Sem fotos de momento.';
                }
            } catch (erro) {
                document.getElementById('msg-carregando').innerText = 'Erro ao carregar as fotos.';
            }
        }
        
        // Quando a página abre, carrega as fotos logo
        document.addEventListener('DOMContentLoaded', carregarGaleria);

        // FUNÇÕES PARA ABRIR O SEU TYPEBOT
        function abrirRobo() {
            document.getElementById('typebot-container').style.display = 'block';
        }
        
        function fecharRobo() {
            document.getElementById('typebot-container').style.display = 'none';
        }
    </script>

    <!-- CÓDIGO DO TYPEBOT -->
    <script type="module">
      import Typebot from 'https://cdn.jsdelivr.net/npm/@typebot.io/js@3.1/dist/web.js'
      
      Typebot.initStandard({
        typebot: "my-typebot-geftcg9",
      });
    </script>

</body>
</html>
