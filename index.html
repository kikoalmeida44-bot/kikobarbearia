<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Kiko Barbearia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; padding: 10px; }
        .container { width: 100%; max-width: 480px; background-color: #0d0d0d; border: 1px solid #c8a355; border-radius: 8px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        .header { text-align: center; margin-bottom: 20px; }
        .logo-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid #c8a355; margin-bottom: 10px; }
        h1 { color: #c8a355; font-size: 1.3rem; letter-spacing: 1px; text-transform: uppercase; }
        p.subtitle { color: #aaaaaa; font-size: 0.85rem; margin-top: 5px; }
        .section-title { color: #c8a355; font-size: 0.9rem; font-weight: 600; margin: 20px 0 10px 0; border-bottom: 1px solid #222; padding-bottom: 5px; text-transform: uppercase; }
        .servico-card { background-color: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .servico-card:hover, .servico-card.selected { border-color: #c8a355; background-color: #222; }
        .servico-info h3 { font-size: 0.95rem; color: #fff; margin-bottom: 3px; }
        .servico-info p { font-size: 0.75rem; color: #888; }
        .servico-preco { font-weight: bold; color: #c8a355; font-size: 0.95rem; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background-color: #1a1a1a; border: 1px solid #333; color: white; border-radius: 4px; font-size: 0.9rem; }
        .btn-principal { width: 100%; background-color: #c8a355; color: #000; border: none; padding: 14px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; cursor: pointer; text-transform: uppercase; margin-top: 15px; transition: 0.2s; }
        .btn-principal:hover { background-color: #b38f44; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .gallery-item { width: 100%; height: 90px; border-radius: 4px; object-fit: cover; border: 1px solid #333; }
        #loading { display: none; text-align: center; color: #c8a355; font-size: 0.9rem; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img id="logo-el" src="https://i.imgur.com/35N9c06.png" class="logo-img" alt="Logo">
            <h1 id="titulo-site">Kiko Barbearia</h1>
            <p class="subtitle" id="subtitulo-site">Tradição e Estilo em Coxim.</p>
        </div>

        <div class="section-title">1. Escolha o Serviço</div>
        <div id="lista-servicos">A carregar serviços...</div>

        <div class="section-title">2. Escolha a Data e Hora</div>
        <div class="form-group">
            <label>Data do Atendimento</label>
            <input type="date" id="data-agendamento" onchange="carregarHorariosDisponiveis()">
        </div>
        <div class="form-group">
            <label>Horário Disponível</label>
            <select id="hora-agendamento">
                <option value="">Selecione uma data primeiro</option>
            </select>
        </div>

        <div class="section-title">3. Seus Dados</div>
        <div class="form-group"><label>Seu Nome Completo</label><input type="text" id="cliente-nome" placeholder="Ex: João da Silva"></div>
        <div class="form-group"><label>Seu WhatsApp (com DDD)</label><input type="tel" id="cliente-fone" placeholder="Ex: 67999999999"></div>
        
        <button class="btn-principal" onclick="agendarHorario()">Confirmar Agendamento</button>
        <div id="loading">A processar o agendamento...</div>

        <div class="section-title" style="margin-top: 25px;">Galeria de Trabalhos</div>
        <div class="gallery-grid" id="galeria-fotos"></div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxbj0EtBYyEYBw1-d8TdA_Rd6bLN6fn893aG6YF12Gp99D8ME4jr7ZKjViCKV-q27C7DQ/exec';
        let servicosData = [];
        let servicoSelecionado = null;

        async function carregarDadosSite() {
            try {
                const res = await fetch(SCRIPT_URL + '?acao=obter_textos');
                const data = await res.json();
                if(data.titulo) document.getElementById('titulo-site').innerText = data.titulo;
                if(data.subtitulo) document.getElementById('subtitulo-site').innerText = data.subtitulo;
                if(data.fundo) document.getElementById('logo-el').src = data.fundo;
                
                if(data.servicos) {
                    servicosData = JSON.parse(data.servicos);
                    const container = document.getElementById('lista-servicos');
                    container.innerHTML = '';
                    servicosData.forEach((s, index) => {
                        const precoStr = parseFloat(s.preco).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                        const div = document.createElement('div');
                        div.className = 'servico-card' + (index === 0 ? ' selected' : '');
                        div.onclick = () => selecionarServico(index, div);
                        div.innerHTML = `<div class="servico-info"><h3>${s.nome}</h3><p>⏱️ ${s.tempo} min - ${s.desc || ''}</p></div><div class="servico-preco">${precoStr}</div>`;
                        container.appendChild(div);
                    });
                    servicoSelecionado = servicosData[0];
                }
            } catch(e) { document.getElementById('lista-servicos').innerHTML = 'Erro ao carregar serviços.'; }

            try {
                const resF = await fetch(SCRIPT_URL + '?acao=obter_fotos');
                const fotos = await resF.json();
                const galeria = document.getElementById('galeria-fotos');
                galeria.innerHTML = '';
                fotos.forEach(link => {
                    const img = document.createElement('img');
                    img.src = link; img.className = 'gallery-item';
                    galeria.appendChild(img);
                });
            } catch(e) {}
        }

        function selecionarServico(index, elemento) {
            document.querySelectorAll('.servico-card').forEach(c => c.classList.remove('selected'));
            elemento.classList.add('selected');
            servicoSelecionado = servicosData[index];
        }

        async function carregarHorariosDisponiveis() {
            const dataEscolhida = document.getElementById('data-agendamento').value;
            const selectHora = document.getElementById('hora-agendamento');
            if(!dataEscolhida) return;
            
            selectHora.innerHTML = '<option>A carregar horários...</option>';
            try {
                const res = await fetch(SCRIPT_URL);
                const agendamentosOcupados = await res.json();
                
                // Horários padrão de funcionamento
                let horariosBase = ["08:00","08:20","08:40","09:00","09:20","09:40","10:00","10:20","10:40","11:00","11:20","13:00","13:20","13:40","14:00","14:20","14:40","15:00","15:20","15:40","16:00","16:20","16:40","17:00","17:20","17:40","18:00","18:20","18:40","19:00","19:20"];
                
                selectHora.innerHTML = '';
                horariosBase.forEach(h => {
                    const ocupado = agendamentosOcupados.some(ag => ag.data === dataEscolhida && ag.hora === h);
                    if (!ocupado) {
                        selectHora.innerHTML += `<option value="${h}">${h}</option>`;
                    }
                });
                if(selectHora.options.length === 0) {
                    selectHora.innerHTML = '<option value="">Sem horários livres neste dia</option>';
                }
            } catch(e) {
                selectHora.innerHTML = '<option value="">Erro ao carregar horários</option>';
            }
        }

        async function agendarHorario() {
            const nome = document.getElementById('cliente-nome').value.trim();
            const fone = document.getElementById('cliente-fone').value.trim();
            const data = document.getElementById('data-agendamento').value;
            const hora = document.getElementById('hora-agendamento').value;

            if(!nome || !fone || !data || !hora || !servicoSelecionado) {
                return alert("Por favor, preencha todos os campos e selecione o serviço e horário!");
            }

            document.getElementById('loading').style.display = 'block';

            const fd = new URLSearchParams();
            fd.append('nome', nome);
            fd.append('telefone', fone);
            fd.append('data', data);
            fd.append('hora', hora);
            fd.append('servico', servicoSelecionado.nome);
            fd.append('valor_total', servicoSelecionado.preco);
            fd.append('duracao_total', servicoSelecionado.tempo);

            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: fd.toString(), mode: 'no-cors' });
                alert("Agendamento realizado com sucesso! Enviámos uma confirmação para o seu WhatsApp.");
                window.location.reload();
            } catch(e) {
                alert("Erro ao realizar agendamento. Tente novamente.");
                document.getElementById('loading').style.display = 'none';
            }
        }

        carregarDadosSite();
    </script>
</body>
</html>
