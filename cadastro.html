<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Minha Barbearia | Kiko SaaS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap');
        body { font-family: 'Montserrat', sans-serif; background-color: #050505; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .cadastro-container { background: #111; border: 1px solid #d4af37; border-radius: 8px; padding: 40px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .logo { color: #d4af37; font-size: 1.8em; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .sub-logo { font-size: 0.85em; color: #aaa; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.85em; color: #ccc; font-weight: 600; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: #d4af37; }
        .btn-gold { background-color: #d4af37; color: #000; border: none; padding: 15px; width: 100%; border-radius: 4px; font-size: 1em; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-gold:hover { background-color: #c09e32; }
        .nota { font-size: 0.75em; color: #888; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="cadastro-container">
        <div class="logo">Kiko SaaS</div>
        <div class="sub-logo">Crie o site e sistema da sua barbearia agora</div>

        <form id="formCadastro">
            <div class="form-group">
                <label>Nome da sua Barbearia</label>
                <input type="text" id="cad-nome" placeholder="Ex: Barbearia do João" required>
            </div>
            
            <div class="form-group">
                <label>Escolha um ID de Acesso (Sem espaços)</label>
                <input type="text" id="cad-id" placeholder="Ex: barbearia_joao" required oninput="formatarID(this)">
                <small style="color:#888; font-size: 0.7em;">Este será o link do seu site.</small>
            </div>

            <div class="form-group">
                <label>Crie uma Senha</label>
                <input type="password" id="cad-senha" placeholder="Digite uma senha segura" required>
            </div>

            <button type="submit" id="btnSubmit" class="btn-gold">Criar Minha Conta Grátis</button>
        </form>
        
        <div class="nota">Ao criar conta, você terá acesso imediato ao seu painel administrativo e link de agendamentos.</div>
    </div>

    <script>
        // COLOQUE O SEU LINK NOVO AQUI DENTRO DAS ASPAS:
        const SCRIPT_URL = 'COLE_AQUI_O_LINK_NOVO_QUE_VOCE_GEROU';

        // Função para não deixar o cliente colocar espaços no ID
        function formatarID(input) {
            input.value = input.value.toLowerCase().replace(/[^a-z0-9_-]/g, '');
        }

        document.getElementById('formCadastro').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const idB = document.getElementById('cad-id').value;
            const nomeB = document.getElementById('cad-nome').value;
            const senhaB = document.getElementById('cad-senha').value;
            const btn = document.getElementById('btnSubmit');

            btn.disabled = true;
            btn.innerText = "A criar sistema...";

            const fd = new URLSearchParams();
            fd.append('acao', 'criar_barbearia');
            fd.append('id_barbearia', idB);
            fd.append('nome', nomeB);
            fd.append('senha', senhaB);

            fetch(SCRIPT_URL, { method: 'POST', body: fd.toString(), mode: 'no-cors' })
            .then(() => {
                alert("Sistema criado com sucesso! Você será redirecionado para o seu painel.");
                
                // Grava o ID no computador do barbeiro para ele já entrar logado
                localStorage.setItem('id_barbearia_ativo', idB);
                
                // Redireciona o novo barbeiro automaticamente para o painel administrativo dele
                window.location.href = `admin.html?id=${idB}`;
            })
            .catch(err => {
                alert("Erro ao criar conta. Tente novamente.");
                btn.disabled = false;
                btn.innerText = "Criar Minha Conta Grátis";
            });
        });
    </script>
</body>
</html>
